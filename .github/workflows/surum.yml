# Nabız sürümü: GitHub'da bir sürüm (Release) yayınlanınca kurulum dosyalarını
# GitHub'ın kendi sunucularında, bu depodaki kaynak koddan derler ve sürüme ekler.
name: Sürüm dosyalarını derle

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Sürüm numarası
        id: v
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Güncelleme paketi (nabiz-guncelleme.zip)
        run: |
          python3 - "src/app/version.json" "${{ steps.v.outputs.ver }}" <<'EOF'
          import json,sys
          p,v=sys.argv[1],sys.argv[2]; d=json.load(open(p)); d['version']=v; json.dump(d,open(p,'w'),ensure_ascii=False)
          EOF
          mkdir -p out
          (cd src/app && zip -qr ../../out/nabiz-guncelleme.zip .)

      - name: Kurulum dosyası (Nabiz-Setup.exe)
        run: |
          cp -r src/app src/setup/app
          cd src/setup
          python3 mksyso.py app/icon.ico setup.manifest rsrc_windows_amd64.syso "${{ steps.v.outputs.ver }}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui" -o Nabiz-Setup.exe .
          zip -qj ../../out/Nabiz-Setup.zip Nabiz-Setup.exe
          sha256sum Nabiz-Setup.exe > ../../out/exe.sha256

      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          S1=$(sha256sum Nabiz-Setup.zip | cut -d' ' -f1)
          S2=$(cut -d' ' -f1 exe.sha256)
          S3=$(sha256sum nabiz-guncelleme.zip | cut -d' ' -f1)
          gh release upload "$GITHUB_REF_NAME" Nabiz-Setup.zip nabiz-guncelleme.zip --clobber -R "$GITHUB_REPOSITORY"
          BODY=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json body -q .body)
          printf '%s\n\n---\n**Bu dosyalar GitHub Actions ile bu depodaki kaynak koddan derlendi.** ([derleme kaydı](%s))\n\nSHA-256\n- Nabiz-Setup.zip: `%s`\n- Nabiz-Setup.exe: `%s`\n- nabiz-guncelleme.zip: `%s`\n' \
            "$BODY" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$S1" "$S2" "$S3" > notes.md
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file notes.md
