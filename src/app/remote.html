<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nabız Kumanda</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;background:#08080a;color:#f3f3f6;overflow:hidden;--acc:#ff3b5c}
.bg{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.4) brightness(.45);transform:scale(1.2);transition:background-image .6s}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:rgba(255,255,255,.6);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1ed760;margin-right:6px;box-shadow:0 0 8px #1ed760}
.off .dot{background:#ff3b5c;box-shadow:0 0 8px #ff3b5c}
.cover{flex:1;min-height:0;display:grid;place-items:center}
.cover img,.cover .ph{width:min(78vw,46vh);aspect-ratio:1;object-fit:cover;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 60px -20px var(--acc);background:#1c1c22}
.meta b{display:block;font-size:22px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;color:rgba(255,255,255,.65);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{min-height:22px;font-size:15px;font-weight:600;color:#fff;text-shadow:0 0 14px var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.18);position:relative;touch-action:none}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:#fff;width:0}
.btns{display:flex;justify-content:space-around;align-items:center}
.btns button{background:none;border:0;color:#fff;padding:10px;border-radius:50%}
.btns button:active{transform:scale(.92)}
.btns svg{width:34px;height:34px;fill:currentColor}
.btns .pp{width:78px;height:78px;background:#fff;color:#000;display:grid;place-items:center}
.btns .pp svg{width:38px;height:38px}
.vol{display:flex;align-items:center;gap:12px}
.vol svg{width:20px;height:20px;fill:rgba(255,255,255,.7);flex:none}
.vol input{flex:1;accent-color:var(--acc);height:28px}
.msg{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:rgba(8,8,10,.85);font-size:15px;line-height:1.6;color:rgba(255,255,255,.8)}
.off .msg{display:grid}
</style>
</head>
<body class="off">
<div class="bg" id="bg"></div>
<div class="wrap">
  <div class="top"><span><span class="dot"></span><span id="conn">Bağlanıyor…</span></span><span>Nabız</span></div>
  <div class="cover"><img id="art" alt="" style="display:none"><div class="ph" id="ph"></div></div>
  <div class="meta"><b id="title">—</b><span id="artist"></span></div>
  <div class="line" id="line"></div>
  <div class="prog"><span id="pos">0:00</span><div class="bar" id="bar"><i id="fill"></i></div><span id="dur">0:00</span></div>
  <div class="btns">
    <button data-c="prev"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M5 6.2v11.6a1 1 0 0 0 1.55.83L15 13v4.5a1 1 0 0 0 1 1h1.5a1 1 0 0 0 1-1v-11a1 1 0 0 0-1-1H16a1 1 0 0 0-1 1V11L6.55 5.37A1 1 0 0 0 5 6.2z"/></svg></button>
    <button data-c="toggle" class="pp" id="pp"></button>
    <button data-c="next"><svg viewBox="0 0 24 24"><path d="M5 6.2v11.6a1 1 0 0 0 1.55.83L15 13v4.5a1 1 0 0 0 1 1h1.5a1 1 0 0 0 1-1v-11a1 1 0 0 0-1-1H16a1 1 0 0 0-1 1V11L6.55 5.37A1 1 0 0 0 5 6.2z"/></svg></button>
  </div>
  <div class="vol"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-5v16l-5-5H4V9z"/></svg><input type="range" id="vol" min="0" max="100" value="80"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-5v16l-5-5H4V9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></div>
</div>
<div class="msg" id="msg">Nabız'a bağlanılamıyor.<br>Bilgisayarda Nabız açık mı ve telefon aynı Wi-Fi'da mı?</div>
<script>
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></svg>';
const $=id=>document.getElementById(id);
const base=location.pathname.replace(/\/$/,'');
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let st=null, online=false, t0=performance.now(), volDrag=false, lastLine='';
const cmd=(c,v)=>fetch(base+'/cmd',{method:'POST',body:JSON.stringify({cmd:c,v})}).catch(()=>{});
function curPos(){ if(!st) return 0; return Math.min(st.dur||0,(st.pos||0)+(st.playing?(performance.now()-t0)/1000:0)) }
function render(){
  const has=online&&st&&st.has;
  document.body.classList.toggle('off',!online);
  $('conn').textContent=online?'Bağlı':'Nabız kapalı';
  $('title').textContent=has?st.title:(online?'Hiçbir şey çalmıyor':'—');
  $('artist').textContent=has?st.artist:'';
  if(has&&st.thumb){ $('art').src=st.thumb; $('art').style.display=''; $('ph').style.display='none'; $('bg').style.backgroundImage=`url("${st.thumb}")` }
  else { $('art').style.display='none'; $('ph').style.display=''; $('bg').style.backgroundImage='none' }
  if(has&&st.acc) document.body.style.setProperty('--acc',st.acc);
  $('pp').innerHTML=has&&st.playing?PAUSE:PLAY;
  if(st&&st.vol!=null&&!volDrag) $('vol').value=st.vol;
  const line=has&&st.line?st.line:''; if(line!==lastLine){ lastLine=line; $('line').style.opacity=0; setTimeout(()=>{$('line').textContent=line;$('line').style.opacity=1},150) }
}
(function frame(){ const p=curPos(), d=st&&st.dur||0; $('fill').style.width=(d?p/d*100:0)+'%'; $('pos').textContent=fmt(p); $('dur').textContent=fmt(d); requestAnimationFrame(frame) })();
const es=new EventSource(base+'/events');
es.onmessage=e=>{ const m=JSON.parse(e.data); if(m.type==='state'){st=m.state;t0=performance.now()} if(m.type==='online') online=m.v; render() };
es.onerror=()=>{ online=false; render() };
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ cmd(b.dataset.c); if(b.dataset.c==='toggle'&&st){ st.pos=curPos(); t0=performance.now(); st.playing=!st.playing; render() } if(navigator.vibrate) navigator.vibrate(15) });
$('bar').addEventListener('pointerdown',e=>{ if(!st||!st.dur) return; const r=e.currentTarget.getBoundingClientRect(); const v=(e.clientX-r.left)/r.width*st.dur; cmd('seek',v); st.pos=v; t0=performance.now() });
$('vol').addEventListener('input',e=>{ volDrag=true; cmd('volset',+e.target.value) });
$('vol').addEventListener('change',()=>{ setTimeout(()=>volDrag=false,800) });
render();
</script>
</body>
</html>
