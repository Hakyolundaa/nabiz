<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nabız</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a;--panel:#111115;--panel2:#17171c;--line:rgba(255,255,255,.07);
  --text:#f3f3f6;--mut:#8d8d99;--acc:#ff3b5c;--yt:#ff2a2a;--sp:#1ed760;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
img{display:block}
svg{width:18px;height:18px;fill:currentColor;flex:none}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* ---------- Layout ---------- */
.app.no-right .right{display:none}
.side,.main,.right{background:var(--panel);border-radius:var(--r);overflow:hidden;min-height:0}
.app{--sw:256px;display:grid;grid-template-columns:var(--sw) 1fr 340px;grid-template-rows:1fr 88px;height:100vh;gap:8px;padding:8px;transition:grid-template-columns .35s cubic-bezier(.2,.9,.3,1)}
.app.no-right{grid-template-columns:var(--sw) 1fr 0}
.app.side-mini{--sw:76px}
/* ---------- modern menü ---------- */
.side{display:flex;flex-direction:column;padding:16px 12px 12px;position:relative;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012) 40%),var(--panel);border:1px solid var(--line)}
.side-glow{position:absolute;inset:-80px auto auto -80px;width:300px;height:300px;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,transparent),transparent 65%);filter:blur(10px);opacity:.75;transition:background .8s}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 16px 6px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:21px;letter-spacing:-.4px;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ff2e63,#c2189b 55%,#5b2cff);box-shadow:0 4px 14px -4px rgba(194,24,155,.7),inset 0 1px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;gap:2.5px;flex:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 18px -4px var(--acc)}
.mark i{width:3px;height:30%;border-radius:2px;background:#fff}
body.is-playing .mark i{animation:eqa .9s ease-in-out infinite}
body.is-playing .mark i:nth-child(2){animation-name:eqb;animation-duration:.7s}
body.is-playing .mark i:nth-child(3){animation-name:eqc;animation-duration:1.05s}
body.is-playing .mark i:nth-child(4){animation-name:eqb;animation-duration:.8s;animation-delay:-.3s}
.sicon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--mut);transition:.2s}
.sicon:hover{color:var(--text);background:rgba(255,255,255,.07)}
.sicon svg{width:18px;height:18px;transition:transform .35s}
.side-mini .sicon svg{transform:rotate(180deg)}
.sbox{display:flex;align-items:center;gap:10px;margin:0 2px 14px;padding:10px 12px;border-radius:12px;color:var(--mut);
  background:rgba(255,255,255,.045);border:1px solid var(--line);transition:.2s;white-space:nowrap}
.sbox:hover{color:var(--text);border-color:color-mix(in srgb,var(--acc) 50%,transparent);background:rgba(255,255,255,.07)}
.sbox svg{width:17px;height:17px}
.sbox kbd{margin-left:auto;font:600 11px Outfit,sans-serif;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--mut)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button,.pls button{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;color:var(--mut);
  font-weight:500;text-align:left;white-space:nowrap;transition:background .2s,color .2s,transform .2s}
.nav button svg{width:20px;height:20px;transition:color .2s}
.nav button:hover,.pls button:hover{color:var(--text);background:rgba(255,255,255,.05);transform:translateX(2px)}
.nav button.on,.pls button.on{color:#fff;font-weight:600;
  background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 26%,transparent),color-mix(in srgb,var(--acc) 5%,transparent));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent)}
.nav button.on::before,.pls button.on::before{content:"";position:absolute;left:-12px;top:22%;bottom:22%;width:4px;border-radius:0 4px 4px 0;
  background:var(--acc);box-shadow:0 0 12px var(--acc)}
.nav button.on svg{color:var(--acc);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acc) 60%,transparent))}
.nav .cnt{margin-left:auto;font-style:normal;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--mut)}
.nav .cnt:empty{display:none}
.sec-t{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:22px 8px 8px 12px;white-space:nowrap}
.sec-t button{color:var(--mut);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.05);transition:.2s}
.sec-t button:hover{color:#000;background:var(--acc)}
.sec-t svg{width:15px;height:15px}
.pls{overflow:auto;flex:1;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px;scrollbar-width:none}
.pls::-webkit-scrollbar{display:none}
.pls button{padding:7px 10px 7px 8px}
.pls .pi{position:relative;width:40px;height:40px;border-radius:10px;flex:none;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;
  background:linear-gradient(135deg,#2c2c36,#17171c);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.pls .pi.one{grid-template-columns:1fr}
.pls .pi img{width:100%;height:100%;object-fit:cover;border-radius:0}
.pls .pi>svg{grid-column:1/-1;place-self:center;width:18px;height:18px;opacity:.6}
.pls .pt{min-width:0;flex:1}
.pls .pt b{display:block;font-weight:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pls small{display:block;font-size:11.5px;color:var(--mut);font-weight:400}
.pls .eqm{display:none;align-items:flex-end;gap:2px;height:14px;width:14px;flex:none}
.pls .eqm i{width:3px;height:40%;border-radius:2px;background:var(--acc)}
.pls button.playing-pl .eqm{display:flex}
body.is-playing .pls button.playing-pl .eqm i{animation:eqa .9s ease-in-out infinite}
body.is-playing .pls button.playing-pl .eqm i:nth-child(2){animation-name:eqb;animation-duration:.7s}
body.is-playing .pls button.playing-pl .eqm i:nth-child(3){animation-name:eqc;animation-duration:1.05s}
.pls .empty-pl{padding:14px 12px;font-size:12.5px;color:var(--mut);line-height:1.5;border:1px dashed var(--line);border-radius:12px;margin:4px 2px}
.side-foot{display:flex;gap:6px;align-items:center;padding:12px 2px 0;margin-top:8px;border-top:1px solid var(--line)}
.fbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mut);background:rgba(255,255,255,.04);transition:.2s;flex:none}
.fbtn:hover{color:var(--text);background:rgba(255,255,255,.09)}
.fbtn svg{width:19px;height:19px}
.fbtn.wide{flex:1;display:flex;gap:10px;justify-content:flex-start;padding:0 14px;font-weight:500}
/* daraltılmış menü: sadece simgeler */
.side-mini .lbl{display:none}
.side-mini .side-top{flex-direction:column;gap:12px;padding:2px 0 14px}
.side-mini .sbox{justify-content:center;padding:10px 0}
.side-mini .nav button,.side-mini .pls button{justify-content:center;padding:10px 0}
.side-mini .nav button:hover,.side-mini .pls button:hover{transform:none}
.side-mini .pls .pt,.side-mini .pls .eqm{display:none!important}
.side-mini .sec-t{justify-content:center;padding:18px 0 8px}
.side-mini .side-foot{flex-direction:column}
.side-mini .fbtn.wide{flex:none;width:40px;justify-content:center;padding:0}
/* açık tema */
body.light .side{background:linear-gradient(180deg,rgba(0,0,0,.015),transparent 40%),#fff}
body.light .nav button.on,body.light .pls button.on{color:#000}
body.light .sbox,body.light .fbtn,body.light .sec-t button{background:rgba(0,0,0,.04)}
body.light .sbox kbd,body.light .nav .cnt{background:rgba(0,0,0,.06)}
.set{width:min(880px,96vw)!important;height:min(660px,88vh);max-height:none;overflow:hidden;padding:0!important;display:flex;flex-direction:column}
.set-wrap{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr);border-top:1px solid var(--line)}
.set-nav{padding:14px 10px;border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:2px}
.set-nav [data-tab]{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--mut);font-size:14px;text-align:left}
.set-nav [data-tab] svg{width:17px;height:17px;flex:none}.set-nav [data-tab]:hover{background:rgba(255,255,255,.05);color:var(--text,#fff)}
.set-nav [data-tab].on{background:rgba(255,255,255,.1);color:var(--text,#fff);font-weight:600}.set-nav [data-tab].on svg{color:var(--acc)}
.set-q{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:10px;border-radius:12px;background:rgba(255,255,255,.06)}.set-q svg{width:15px;height:15px;opacity:.6;flex:none}
.set-q input{flex:1;min-width:0;background:none!important;border:0!important;outline:0;box-shadow:none!important;padding:0!important;margin:0!important;line-height:1.4;color:inherit;font:inherit;font-size:13.5px;height:auto}
.set-ver{margin-top:auto;padding:12px;font-size:11.5px;color:var(--mut);opacity:.7}
.set-body{overflow:auto;padding:4px 8px 24px}
.set-body .set-s h4{font-size:22px;letter-spacing:-.4px;text-transform:none;color:var(--text,#fff);margin:16px 0 6px;font-weight:700}
.set-body.searching .set-s h4{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);font-weight:600}
.set-empty{padding:30px 24px;color:var(--mut)}
.set-h{background:transparent!important;padding:18px 24px 14px}
body.light .set-q,body.light .set-nav [data-tab].on{background:rgba(0,0,0,.06)}
@media (max-width:640px){.set-wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}.set-nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.set-q,.set-ver{display:none}.set-nav [data-tab]{white-space:nowrap}}
.set-h{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 8px;position:sticky;top:0;background:#18181d;z-index:2}
.set-h h3{font-size:20px;margin:0}
.set-h button{color:var(--mut);padding:6px;border-radius:8px}.set-h button:hover{color:#fff;background:rgba(255,255,255,.07)}
.set-s{padding:6px 24px 14px}
.set-s h4{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);margin:14px 0 4px}
.set-r{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-r:last-child{border-bottom:0}
.set-r b{display:block;font-weight:500}
.set-r small strong{color:#ddd;font-weight:600}
.set-r small{display:block;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.4}
.sw{width:42px;height:24px;border-radius:99px;background:#34343e;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(18px)}
.seg{display:flex;background:#0e0e12;border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.seg button{padding:6px 11px;border-radius:7px;font-size:12.5px;color:var(--mut)}
.seg button.on{background:#2a2a33;color:#fff}
.sws{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.swc{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.swc.on{border-color:#fff}
.swc.auto{background:conic-gradient(#ff3b5c,#ffb400,#1ed760,#00c2ff,#8a2be2,#ff3b5c)}
.keyrow{display:flex;gap:8px;margin-top:8px}
.keyrow input{flex:1;background:#0e0e12;border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;font-size:13px}
body.noglow .main::before{display:none}
body.noglow .logo .dot{box-shadow:none}
body.noglow .island.playing{animation:none}
.drop.on{display:grid}

.main{position:relative;overflow:auto}
.main::before{content:"";position:absolute;inset:0 0 auto 0;height:320px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 28%,transparent),transparent);pointer-events:none;transition:background .8s}
.mwrap{position:relative;padding:64px 28px 40px}
.hello{font-size:30px;font-weight:700;letter-spacing:-.6px}
.sub{color:var(--mut);margin-top:4px}
.addbox{display:flex;gap:8px;margin:22px 0 30px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:6px;backdrop-filter:blur(10px)}
.addbox input{flex:1;background:none;border:0;outline:0;padding:10px 12px}
.addbox input::placeholder{color:#6d6d78}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;background:var(--text);color:#000;font-weight:600;transition:.15s}
.btn:hover{transform:scale(1.03)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text)}
.h2{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:600;margin:6px 0 14px}
.chips{display:flex;gap:6px}
.chip{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);font-size:12px;font-weight:500;color:var(--mut)}
.chip.on{background:var(--text);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
.card{padding:12px;border-radius:14px;background:rgba(255,255,255,.025);transition:background .2s;position:relative;cursor:pointer}
.card:hover{background:rgba(255,255,255,.06)}
.card.active .ct{color:var(--acc)}
.cv{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#2b2b35,#151519);margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.cv img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:flex;align-items:center;gap:5px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%}
.badge.yt::before{background:var(--yt)}.badge.sp::before{background:var(--sp)}
.cplay{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--acc);color:#000;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.card:hover .cplay,.card.active .cplay{opacity:1;transform:none}
.cm{font-size:11.5px;color:var(--mut);opacity:.8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .popb{display:inline-flex;gap:2px;margin-right:10px;vertical-align:middle}.trow .popb i{width:3px;height:10px;border-radius:2px;background:rgba(255,255,255,.18)}.trow .popb i.on{background:var(--acc)}
.ahead .row{flex-wrap:wrap}
.ct{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cact{display:flex;gap:2px;margin-top:8px;opacity:.55;transition:.2s;align-items:center}
.card:hover .cact{opacity:1}
.cact .addlib{margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--text)}
.cact .addlib:hover{background:var(--acc);color:#000}
.cact .addlib.done{background:none;color:var(--mut);cursor:default}
.cact .addlib svg{width:13px;height:13px}
.cact .rm{margin-left:auto}
.cact button{padding:6px;border-radius:8px;color:var(--mut)}.cact button:hover{color:var(--text);background:rgba(255,255,255,.07)}
.cact button.on{color:var(--acc);opacity:1}
.cact svg{width:16px;height:16px}
.hrow{display:grid;grid-auto-flow:column;grid-auto-columns:172px;gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.hrow .card{scroll-snap-align:start}
.hrow::-webkit-scrollbar{height:8px}
.rank{position:absolute;left:8px;bottom:6px;font-size:42px;font-weight:800;line-height:1;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.8);letter-spacing:-2px}
.fyc.flow{--g1:#00c2a8;--g2:#0b2a5b}.fyc.flow .fl{position:absolute;right:16px;bottom:14px;width:46px;height:46px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fyc.flow span:not(.fl){display:block;padding-right:58px}.fyc.flow .fl svg{width:20px;height:20px}.fyc.flow.on .fl{animation:flp 1.6s ease-in-out infinite}@keyframes flp{50%{transform:scale(1.08)}}
.fyc.wrap{--g1:#ff3bd4;--g2:#3b0a6b}
.privtag{display:none;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:#6d5dfc;color:#fff;margin-left:6px}
body.private .privtag{display:inline-block}body.private #privBtn{background:#6d5dfc;color:#fff}
.side-mini .privtag{display:none!important}
.flowbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:8px;padding:8px 10px;border-radius:10px;background:rgba(0,194,168,.12)}
.flowbar b{color:#00c2a8}.flowbar button{font-size:12px;color:var(--mut);text-decoration:underline}
.alb .rel{color:var(--acc);font-weight:600}
.arts.sm{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.arts.hs{grid-auto-flow:column;grid-auto-columns:92px;grid-template-columns:none;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.arts.hs::-webkit-scrollbar{display:none}.arts.sm b{font-size:12px;font-weight:500}
.modal textarea{width:100%;min-height:200px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;color:inherit;font:13px/1.5 inherit;padding:10px;resize:vertical;outline:0}
.codebox{word-break:break-all;font:12px/1.4 ui-monospace,Consolas,monospace;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:150px;overflow:auto;user-select:all}
body.light .modal textarea,body.light .codebox{background:rgba(0,0,0,.04)}
.wr{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(0,0,0,.82);backdrop-filter:blur(16px)}
.wr .st{position:relative;width:min(420px,92vw);height:min(760px,92vh);border-radius:24px;overflow:hidden;background:linear-gradient(160deg,var(--w1),var(--w2));color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.6);cursor:pointer;user-select:none}
.wr .bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:3}.wr .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.wr .bars i b{display:block;height:100%;width:0;background:#fff}.wr .bars i.done b{width:100%}.wr .bars i.cur b{animation:wrb 6s linear forwards}@keyframes wrb{to{width:100%}}
.wr .sl{position:absolute;inset:0;padding:56px 30px 30px;display:flex;flex-direction:column;justify-content:center;animation:wri .5s ease}
@keyframes wri{from{opacity:0;transform:translateY(18px)}}
.wr .sl small{font-size:13px;letter-spacing:.12em;opacity:.8;text-transform:uppercase}.wr .sl h2{font-size:38px;line-height:1.05;letter-spacing:-1px;margin:10px 0}
.wr .big{font-size:84px;font-weight:800;letter-spacing:-3px;line-height:1}.wr .sl p{opacity:.85;font-size:15px;line-height:1.5}
.wr .li{display:flex;align-items:center;gap:12px;margin:7px 0}.wr .li img,.wr .li .ph{width:52px;height:52px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,.15);flex:none}
.wr .li .n{font-size:22px;font-weight:800;width:26px;opacity:.8}.wr .li b{display:block;font-size:15px}.wr .li span{font-size:12.5px;opacity:.75}

.genre,.fyc,.ghead,.plcover{color:#fff}
body.light .ghead .btn.ghost{background:rgba(255,255,255,.18);color:#fff}

.wn-h{position:relative;padding:28px 28px 20px;background:radial-gradient(circle at 0 0,color-mix(in srgb,var(--acc) 45%,transparent),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.04),transparent)}

.plmeta small{text-transform:uppercase;font-size:11px;letter-spacing:1.4px;color:var(--mut);font-weight:600}

.plmeta .row{display:flex;gap:8px;align-items:center}
.banner{background:rgba(255,170,0,.12);border:1px solid rgba(255,170,0,.3);color:#ffd27a;border-radius:12px;padding:12px 14px;margin-bottom:18px;line-height:1.5}

/* ---------- Right panel ---------- */
.right{display:flex;flex-direction:column;position:relative}
.rbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(60px) saturate(1.4);opacity:.35;transform:scale(1.3);transition:background-image .6s}
.rin{position:relative;display:flex;flex-direction:column;height:100%;padding:18px;overflow:auto}
.rhead{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:14px}
.rhead button{color:var(--mut);padding:4px;border-radius:6px}.rhead button:hover{color:var(--text)}
.stage{border-radius:12px;overflow:hidden;background:#000;box-shadow:0 14px 40px rgba(0,0,0,.55)}
/* video her zaman tek yerde: kapalıyken görünmez, büyük ekranda yerine oturur */
#stage{position:fixed;left:-10000px;top:0;width:480px;height:270px;z-index:96;transition:left .0s}
#stage .yt{aspect-ratio:auto!important;height:100%}#stage .idle{aspect-ratio:auto;height:100%}
#stage iframe{pointer-events:none}
body.npopen #stage{left:var(--sx);top:var(--sy);width:var(--sw2);height:var(--sh);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);cursor:pointer}
.rcover{position:relative;aspect-ratio:1;flex:none;width:100%;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#1c1c22,#0d0d10);cursor:pointer;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.rcover img{width:100%;height:100%;object-fit:cover;display:block}.rcover img.none{display:none}
.rcover .rph{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;color:rgba(255,255,255,.2);z-index:-0}.rcover img:not(.none)+.rph{display:none}
.rcover .rexp{position:absolute;right:10px;bottom:10px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);font-size:12px;opacity:0;transition:opacity .2s}
.rcover:hover .rexp{opacity:1}
.np{cursor:pointer}.np .like,.np .tt [data-artist]{cursor:pointer}
.npv{position:fixed;left:0;right:0;top:0;bottom:var(--barh,96px);z-index:95;opacity:0;pointer-events:none;transition:opacity .3s;overflow:hidden;background:#07070a}
body.npopen .npv{opacity:1;pointer-events:auto}
.npbg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(80px) saturate(1.5);opacity:.55;transform:scale(1.1);transition:background-image .6s}
.npv::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.65));pointer-events:none}
.npx{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:3;width:46px;height:32px;border-radius:99px;background:rgba(255,255,255,.1);color:#fff;font-size:20px;line-height:1}
.npx:hover{background:rgba(255,255,255,.2)}
.npw{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px 24px;gap:20px;color:#fff}
.npslot{width:min(1100px,92%,calc((100vh - var(--barh,96px) - 260px) * 16 / 9));aspect-ratio:16/9;flex:none}
.npmeta{width:min(1100px,92%,calc((100vh - var(--barh,96px) - 260px) * 16 / 9));display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.npmeta h1{font-size:32px;letter-spacing:-.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.npa{color:rgba(255,255,255,.7);font-size:17px;margin-top:2px;cursor:pointer}.npa:hover{text-decoration:underline}
.npb{display:flex;gap:8px;flex:none}.npb button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}.npb button:hover{background:rgba(255,255,255,.2)}
.npb button.on{color:var(--acc)}.npb svg{width:20px;height:20px}
.nply{width:min(1100px,92%);text-align:center;min-height:56px}.nply b{display:block;font-size:22px;font-weight:700;text-shadow:0 0 20px color-mix(in srgb,var(--acc) 50%,transparent)}.nply span{display:block;font-size:15px;opacity:.5;margin-top:4px}
body.nply-off .nply{visibility:hidden}
body.light .npv{background:#07070a}
body.mini.npopen .npv{display:none}
.stage .yt{aspect-ratio:16/9;display:none}
.stage .yt iframe,.stage .yt>div{width:100%;height:100%}
.stage.show-yt .yt{display:block}
.stage .idle{aspect-ratio:1;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px;background:linear-gradient(135deg,#1c1c22,#0d0d10)}
.stage.show-yt .idle{display:none}
.rtitle{font-size:20px;font-weight:700;margin-top:16px;letter-spacing:-.3px}
.rartist{color:var(--mut);margin-top:2px}
.qlist{margin-top:22px}
.rtabs{display:flex;gap:6px;margin-top:18px;margin-bottom:10px}
.rtabs button{padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--mut);background:rgba(255,255,255,.06)}
.rtabs button.on{background:#fff;color:#000}
.lyr{flex:1;min-height:180px;overflow:auto;padding:6px 2px 60px;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 80%,transparent);scrollbar-width:none}
.lyr::-webkit-scrollbar{display:none}
.lyr p{font-size:17px;font-weight:600;line-height:1.4;padding:6px 4px;color:rgba(255,255,255,.38);cursor:pointer;transition:color .25s,transform .25s;transform-origin:left center;border-radius:8px}
.lyr p:hover{color:rgba(255,255,255,.7)}
.lyr p.past{color:rgba(255,255,255,.55)}
.lyr p.now{color:#fff;transform:scale(1.04);text-shadow:0 0 18px color-mix(in srgb,var(--acc) 70%,transparent)}
.lyr .plain{white-space:pre-wrap;color:rgba(255,255,255,.8);font-weight:500;font-size:15px;line-height:1.7;cursor:default}
.lyoff{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 10px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.05)}
.lyoff button{padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.08);font-size:12px}.lyoff button:hover{background:rgba(255,255,255,.16)}.lyoff b{color:var(--text,#fff);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.lyoff .warn{color:#ffb84d;width:100%}.lyrview .lyoff{display:inline-flex;margin-bottom:24px}
body.light .lyoff{background:rgba(0,0,0,.04)}
.lyr .msg{color:var(--mut);font-size:13px;line-height:1.6;padding:10px 4px}
.lyrview{position:relative;min-height:100%;margin:-64px -28px -40px;padding:80px 60px 120px;overflow:hidden}
.lyrview .lbg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(70px) saturate(1.5) brightness(.55);transform:scale(1.2)}
.lyrview .lin{position:relative;max-width:820px}
.lyrview .lhead{display:flex;align-items:center;gap:16px;margin-bottom:34px}
.lyrview .lhead img{width:72px;height:72px;border-radius:12px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.lyrview .lyr{-webkit-mask-image:none;mask-image:none;overflow:visible;padding:0}
.lyrview .lyr p{font-size:34px;font-weight:800;letter-spacing:-.6px;padding:10px 6px;color:rgba(255,255,255,.35)}
.lyrview .lyr p.past{color:rgba(255,255,255,.5)}
.lyrview .lyr p.now{color:#fff;transform:none}
.lyrview .lyr .plain{font-size:22px}
.qlist h4{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:8px}
.qi{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;cursor:pointer}
.qi:hover{background:rgba(255,255,255,.06)}
.qi img,.qi .ph{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#222;flex:none}
.qi div{min-width:0}
.qi b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi span{font-size:12px;color:var(--mut)}
.qi.now b{color:var(--acc)}

/* ---------- Player bar ---------- */
.bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:0 14px;background:#000;border-radius:var(--r)}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np img,.np .ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#1b1b20;flex:none;box-shadow:0 0 0 1px var(--line)}
.np .tt{min-width:0}
.np b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np span{font-size:12px;color:var(--mut)}
.np .like{color:var(--mut);padding:6px}.np .like.on{color:var(--acc)}
.ctr{display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;align-items:center;gap:18px}
.btns button{color:#bdbdc7;transition:.15s;position:relative}
.btns button:hover{color:#fff}
.btns button.on{color:var(--acc)}
.btns button.on::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--acc);transform:translateX(-50%)}
.btns .pp{width:38px;height:38px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.btns .pp:hover{transform:scale(1.06);color:#000}
.rep1{position:absolute;font-size:8px;font-weight:700;top:-4px;right:-6px}
.prog{display:flex;align-items:center;gap:10px;width:100%;max-width:620px;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.track{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.12);position:relative;cursor:pointer}
.track:hover{height:6px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:#fff;width:0}
.track:hover .fill{background:var(--acc)}
.rgt{display:flex;justify-content:flex-end;align-items:center;gap:12px;color:#bdbdc7}
.rgt button:hover{color:#fff}
.rgt button.on{color:var(--acc)}
.vol{width:100px;flex:none;accent-color:var(--acc)}

/* ---------- Dynamic Island ---------- */
.island{
  --w:178px;--h:38px;
  position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:60;
  width:var(--w);height:var(--h);border-radius:22px;background:#000;color:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.6);
  transition:width .5s cubic-bezier(.2,1.1,.3,1),height .5s cubic-bezier(.2,1.1,.3,1),border-radius .5s,box-shadow .6s;
  overflow:hidden;display:grid;grid-template-columns:100%;grid-template-rows:100%;user-select:none
}
.island.has{--w:196px}
.island.playing{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 16px -6px var(--acc),0 10px 30px rgba(0,0,0,.6)}
  50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent),0 0 34px -2px var(--acc),0 10px 30px rgba(0,0,0,.6)}
}
.island>*{grid-area:1/1}
.isl-c{display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;height:38px;transition:opacity .25s}
.isl-clock{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.isl-art{width:24px;height:24px;border-radius:7px;object-fit:cover;background:#222;transition:box-shadow .6s}
.playing .isl-art{box-shadow:0 0 14px 2px var(--acc)}
.isl-art.none{background:radial-gradient(circle,var(--acc),transparent 70%);border-radius:50%;opacity:.0}
.island.has .isl-art.none{opacity:1}
.eq{display:flex;align-items:center;gap:2.5px;height:16px;width:24px}
.eq i{width:3px;height:22%;border-radius:2px;background:linear-gradient(to top,var(--acc),#fff);transition:height .3s}
.playing .eq i{animation:eqa .9s ease-in-out infinite}
.playing .eq i:nth-child(2){animation-name:eqb;animation-duration:.7s}
.playing .eq i:nth-child(3){animation-name:eqc;animation-duration:1.05s}
.playing .eq i:nth-child(4){animation-name:eqb;animation-duration:.8s;animation-delay:-.3s}
.playing .eq i:nth-child(5){animation-name:eqa;animation-duration:.95s;animation-delay:-.5s}
@keyframes eqa{0%,100%{height:25%}30%{height:95%}60%{height:45%}}
@keyframes eqb{0%,100%{height:60%}40%{height:20%}70%{height:100%}}
@keyframes eqc{0%,100%{height:35%}50%{height:85%}}
.isl-f{width:400px;opacity:0;pointer-events:none;padding:16px 18px;display:flex;flex-direction:column;gap:12px;transition:opacity .2s}
.island.open{--w:400px;--h:176px;border-radius:36px}
.island.open .isl-c{opacity:0;pointer-events:none}
.island.open .isl-f{opacity:1;pointer-events:auto;transition-delay:.15s}
.isl-top{display:flex;gap:14px;align-items:center}
.isl-top img,.isl-top .ph{width:58px;height:58px;border-radius:14px;object-fit:cover;background:#222;flex:none;box-shadow:0 0 24px -4px var(--acc)}
.isl-meta{flex:1;min-width:0}
.isl-meta b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isl-meta span{color:#9a9aa6;font-size:13px}
.isl-top .eq{height:24px;width:30px}
.isl-top .eq i{width:4px}
.isl-prog{display:flex;align-items:center;gap:10px;font-size:11px;color:#9a9aa6;font-variant-numeric:tabular-nums}
.isl-prog .track{height:5px}
.isl-btns{display:flex;justify-content:center;align-items:center;gap:30px}
.isl-btns button{color:#ddd}.isl-btns button:hover{color:#fff}
.isl-btns svg{width:22px;height:22px}
.isl-btns .big svg{width:30px;height:30px}
.isl-btns .pipb{position:absolute;right:20px}
.isl-btns .pipb svg{width:18px;height:18px}

/* Island inside always-on-top mini window */
.island.in-pip{position:static;transform:none;width:100vw;height:100vh;border-radius:0;box-shadow:none;animation:none}
.island.in-pip .isl-c,.island.in-pip .isl-f{display:none}
.isl-p{display:none}
.island.in-pip .isl-p{display:flex;align-items:center;gap:12px;padding:0 14px;height:100vh}
.isl-p img,.isl-p .ph{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#222;box-shadow:0 0 18px -2px var(--acc)}
.isl-p .isl-meta b{font-size:14px}.isl-p .isl-meta span{font-size:12px}
.isl-p button{color:#ddd}.isl-p button:hover{color:#fff}
.isl-p .isl-clock{color:#9a9aa6;font-size:12px}
body.pip-body{background:#000;margin:0;overflow:hidden}

async function keep(t){

  tracks.unshift(n); save(); renderSidebar(); return n;

const toSec=d=>String(d||'').split(':').reduce((a,b)=>a*60+(+b||0),0);
const norm=x=>String(x||'').toLocaleLowerCase('tr').replace(/[^\p{L}\p{N} ]+/gu,' ').replace(/\s+/g,' ').trim();
// Bir arama sonucunun aranan şarkıya ne kadar uyduğu: resmi ses / Topic kanalı öne, cover/canlı/remix geriye
function scoreVideo(v,artist,title,exp){
  const T=norm(v.title), C=norm(v.channel), a=norm(artist), t=norm(title), sec=toSec(v.duration);
  let sc=0;
  if(v.live||!sec||sec<60||sec>720) sc-=100;
  if(/ topic$/.test(C)) sc+=30;
  if(/official audio|resmi ses|\baudio\b/.test(T)) sc+=15;
  if(/official video|official music video|resmi video|resmi klip|\bklip\b/.test(T)) sc+=10;
  if(/lyric|sözleri|sozleri/.test(T)) sc+=4;
  if(a){ const a1=a.split(' ')[0]; if(C.includes(a1)||T.includes(a)) sc+=15; else if(T.includes(a1)) sc+=6; }
  if(t){ if(T.includes(t)) sc+=25; else { const w=t.split(' ').filter(x=>x.length>2); if(w.length&&w.every(x=>T.includes(x))) sc+=12; } }
  const bad=/(cover|canlı|canli|\blive\b|remix|slowed|sped up|speed up|\b8d\b|karaoke|reaction|tepki|nightcore|instrumental|altyapı|altyapi|1 saat|1 hour|loop|mashup|edit audio)/;
  if(bad.test(T)&&!bad.test(t)) sc-=40;
  if(exp>0&&sec){ const d=Math.abs(sec-exp); sc+=d<=4?14:d<=10?8:d<=25?2:d>60?-12:-4 }
  return sc;
}
function bestVideo(list,artist,title,skip=[],exp=0){
  const c=list.filter(v=>!skip.includes(v.id)).map(v=>({v,sc:scoreVideo(v,artist,title,exp)})).sort((x,y)=>y.sc-x.sc);
  return c.length&&c[0].sc>-50?c[0].v:null;
}

const __rp=new WeakMap();
function resolveYT(t){ if(__rp.has(t)) return __rp.get(t); const p=_resolveYT(t).finally(()=>__rp.delete(t)); __rp.set(t,p); return p }
async function _resolveYT(t){
  try{
    const j=await (await fetch('/api/search?q='+encodeURIComponent(t.query||`${t.artist} ${t.title}`))).json();
    if(!Array.isArray(j)||!j.length) return false;
    const best=bestVideo(j,t.artist,t.title,[],t.dur||0)||j.find(v=>!v.live)||j[0];
    t.ref=best.id; t.url=`https://www.youtube.com/watch?v=${best.id}`;
    if(!t.thumb) t.thumb=`https://i.ytimg.com/vi/${best.id}/hqdefault.jpg`;
    return true;
  }catch{return false}
}

/* ================= Link parsing & metadata ================= */
function parseLink(s){
  s=(s||'').trim(); let m;
  if(m=s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/))
    return {src:'yt',kind:'video',ref:m[1],url:`https://www.youtube.com/watch?v=${m[1]}`};
  if(m=s.match(/[?&]list=([A-Za-z0-9_-]+)/))
    return {src:'yt',kind:'playlist',ref:m[1],url:`https://www.youtube.com/playlist?list=${m[1]}`};
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return {src:'yt',kind:'video',ref:s,url:`https://www.youtube.com/watch?v=${s}`};
  return null;
}
function cleanYT(title,author){
  let a=(author||'').replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'').trim();
  let t=(title||'').replace(/\s*[\(\[][^\)\]]*(official|resmi|lyric|audio|video|klip|visualizer|hd|4k|m\/v)[^\)\]]*[\)\]]/gi,'').trim();
  const m=t.match(/^(.+?)\s+[-–—|]\s+(.+)$/); if(m){a=m[1].trim();t=m[2].trim()}
  return {title:t||title,artist:a};
}
async function fetchMeta(p){
  const e=encodeURIComponent(p.url);
  const urls=[`https://www.youtube.com/oembed?format=json&url=${e}`,`https://noembed.com/embed?url=${e}`];
  for(const u of urls){try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();if(j.error||!j.title)continue;return j}catch{}}
  return null;
}
const kindTR={track:'Şarkı',album:'Albüm',playlist:'Çalma listesi',episode:'Bölüm',artist:'Sanatçı',video:'Video'};

async function addFromInput(text,{play=false,toPl=null}={}){
  const lines=String(text).split(/[\s,]+/).filter(Boolean); let added=[];
  let skippedSp=0;
  for(const line of lines){
    if(/spotify/i.test(line)){skippedSp++;continue}
    const p=parseLink(line); if(!p) continue;
    if(p.kind==='playlist'&&HTTP&&!play){ if(await importPlaylist(p.ref)) continue }
    let t=tracks.find(x=>x.ref===p.ref);
    if(!t){
      t={id:uid(),...p,title:p.kind==='playlist'?'YouTube çalma listesi':'YouTube videosu',artist:'YouTube',
         thumb:p.kind==='video'?`https://i.ytimg.com/vi/${p.ref}/hqdefault.jpg`:'',added:Date.now(),needsMeta:true};
      tracks.unshift(t);
      fetchMeta(p).then(j=>{ if(!j) return;
        {const c=cleanYT(j.title,j.author_name);t.title=c.title;t.artist=c.artist||'YouTube'}
        if(j.thumbnail_url)t.thumb=j.thumbnail_url;
        t.needsMeta=false; save(); renderAll();
        if(cur&&cur.id===t.id){disp={title:t.title,artist:t.artist,thumb:t.thumb};applyColor(t,true);renderNow()}
      });
    }
    if(toPl){const pl=playlists.find(x=>x.id===toPl);if(pl&&!pl.ids.includes(t.id))pl.ids.push(t.id)}
    added.push(t);
  }
  if(!added.length){toast(skippedSp?'Nabız artık sadece YouTube ile çalışıyor — YouTube linki yapıştır':'Geçerli bir YouTube linki bulunamadı');return []}
  save(); renderAll(); toast(added.length>1?`${added.length} öğe eklendi`:'Eklendi: '+added[0].title);
  if(play) playTrack(added[0].id,added.map(t=>t.id));
  return added;
}

/* ================= Color from cover ================= */
function hashColor(s){let h=0;for(const c of s||'x')h=(h*31+c.charCodeAt(0))>>>0;return `hsl(${h%360} 85% 60%)`}
function extractColor(url){return new Promise(res=>{ if(!url) return res(null);
  const img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=28;const x=c.getContext('2d');x.drawImage(img,0,0,28,28);
    const d=x.getImageData(0,0,28,28).data;let r=0,g=0,b=0,w=0;
    for(let i=0;i<d.length;i+=4){const R=d[i],G=d[i+1],B=d[i+2],mx=Math.max(R,G,B),mn=Math.min(R,G,B),s=mx?(mx-mn)/mx:0,wt=s*s*(mx/255)+.002;r+=R*wt;g+=G*wt;b+=B*wt;w+=wt}
    r/=w;g/=w;b/=w; const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0;
    if(mx!==mn){const dd=mx-mn;h=mx===r?((g-b)/dd)%6:mx===g?(b-r)/dd+2:(r-g)/dd+4;h=Math.round(h*60);if(h<0)h+=360}
    const sat=mx===mn?0:(mx-mn)/mx; res(sat<.12?`hsl(${h} 10% 75%)`:`hsl(${h} 88% 60%)`);
  }catch{res(null)}};
  img.onerror=()=>res(null); img.src=url;
})}

// Video başka uygulamalarda oynatmaya kapalıysa ya da silinmişse: aynı şarkının başka bir yüklemesini bul ve çal
async function playAlternate(t,code){
  if(t.kind==='playlist'){ toast('Bu listedeki bir video oynatılamadı, atlanıyor'); setTimeout(()=>{try{yt.nextVideo()}catch{next()}},800); return }
  let failed='';
  try{ const d=yt.getVideoData(); failed=d&&d.video_id||t.ref }catch{ failed=t.ref }
  t._tried=(t._tried||[]).concat(failed);
  if(t._tried.length>3||!navigator.onLine){ toast('Bu şarkı oynatılamadı, sıradakine geçiliyor'); t._tried=[]; setTimeout(next,1200); return }
  toast('Bu yükleme dışarıda oynatılamıyor — aynı şarkının başka bir yüklemesi aranıyor…',3000);
  try{
    const j=await (await fetch('/api/search?q='+encodeURIComponent(`${t.artist||''} ${t.title||''}`.trim()))).json();
    const alt=Array.isArray(j)&&bestVideo(j,t.artist,t.title,t._tried);
    if(cur!==t) return;
    if(!alt){ toast('Başka yükleme bulunamadı, sıradakine geçiliyor'); t._tried=[]; setTimeout(next,1200); return }
    t.ref=alt.id; t.url='https://www.youtube.com/watch?v='+alt.id;
    if(!t.temp) save();   // kitaplıktaki şarkı bundan sonra çalışan yüklemeyi kullansın
    yt.loadVideoById(alt.id);
  }catch{ toast('Bu şarkı oynatılamadı, sıradakine geçiliyor'); setTimeout(next,1200) }
}
function next(){
  if(!cur)return;
  if(cur.src==='yt'&&cur.kind==='playlist'&&ytReady){const pl=yt.getPlaylist()||[];if(yt.getPlaylistIndex()<pl.length-1){yt.nextVideo();return}}
  if(!queue.length)return;
  if(shuffle&&queue.length>1){let n=shufNext; if(!(n>=0&&n<queue.length&&n!==qi)){ do{n=Math.floor(Math.random()*queue.length)}while(n===qi) } qi=n; shufNext=-1}
  else if(qi+1<queue.length) qi++;
  else if(repeat==='all') qi=0;
  else { if(settings.radio!==false){ startRadio().then(ok=>{ if(!ok) setPlaying(false) }); return } setPlaying(false); return }
  load(byId(queue[qi]));
}
/* ---- Sıradaki şarkıyı önceden hazırla: geçişte arama beklemesi olmasın ---- */
let shufNext=-1, pfT=0;
function upcoming(){
  if(!queue.length||!cur) return [];
  if(shuffle){ if(queue.length<2) return []; if(!(shufNext>=0&&shufNext<queue.length&&shufNext!==qi)){ do{shufNext=Math.floor(Math.random()*queue.length)}while(shufNext===qi) } return [byId(queue[shufNext])].filter(Boolean) }
  const out=[]; for(let k=1;k<=2;k++){ let i=qi+k; if(i>=queue.length){ if(repeat!=='all') break; i%=queue.length } const t=byId(queue[i]); if(t) out.push(t) }
  return out;
}
function prefetchNext(){
  clearTimeout(pfT); pfT=setTimeout(()=>{
    if(!navigator.onLine) return;
    for(const t of upcoming()){
      if(t.src==='yt'&&t.kind!=='playlist'&&!t.ref) resolveYT(t).then(ok=>{ if(ok&&!t.temp) save(); if(ok) pushState() }).catch(()=>{});
      else if(t.ref&&t.thumb===undefined) {}
    }
  },1500);
}

let discTaste=null, discBusy=false, discFrom=[], discFailed=false;
function tasteArtists(){
  const sc=new Map(), add=(a,w)=>{ a=mainArtist(a); if(a) sc.set(a,(sc.get(a)||0)+w) };
  (settings.seedArtists||[]).forEach(a=>add(a,6)); (settings.follows||[]).forEach(f=>add(f.name,5));
  tracks.filter(t=>liked.has(t.id)).forEach(t=>add(t.artist,1.5));
  history.filter(h=>h.at>Date.now()-60*864e5).forEach(h=>add(h.artist,.4));
  return [...sc.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
async function buildTasteDiscover(){
  if(discBusy||!HTTP||!navigator.onLine) return; const A=tasteArtists(); if(!A.length) return;
  discBusy=true;
  try{
    const known=new Set(history.slice(-300).map(h=>h.ref).concat(tracks.map(t=>t.ref)));
    const pick=shuf(A.slice(0,12)).slice(0,3); discFrom=pick.slice(0,2);
    const get=async u=>{ try{ const j=await (await fetch(u)).json(); return Array.isArray(j)?j:[] }catch{ return [] } };
    const ok=v=>{ const sec=toSec(v.duration); return v&&v.id&&!v.live&&sec>=90&&sec<=480&&!known.has(v.id)&&!isBanned(v.id) };
    // 1) bu sanatçıların şarkıları  2) onlara benzeyenler (YouTube "ilgili")  3) benzer sanatçılardan biri
    const byArtist=await Promise.all(pick.map(a=>get('/api/search?q='+encodeURIComponent(a))));
    const seeds=byArtist.map((L,i)=>bestVideo(L,pick[i],'')).filter(Boolean).map(v=>v.id);
    const rel=(await Promise.all(seeds.slice(0,3).map(id=>get('/api/related?id='+encodeURIComponent(id))))).flat();
    let simA=[]; try{ const a=await (await fetch('/api/artist?q='+encodeURIComponent(pick[0]))).json(); simA=shuf((a.related||[]).map(r=>r.name)).slice(0,2) }catch{}
    const sim=(await Promise.all(simA.map(a=>get('/api/search?q='+encodeURIComponent(a))))).map((L,i)=>L.filter(v=>scoreVideo(v,simA[i],'')>0).slice(0,4)).flat();
    const own=byArtist.map((L,i)=>shuf(L.filter(v=>scoreVideo(v,pick[i],'')>0)).slice(0,3)).flat();
    const seen=new Set(), out=[]; const push=v=>{ if(!ok(v)||seen.has(v.id)) return; seen.add(v.id);
      const c=cleanYT(v.title,v.channel); const t={id:'d:'+v.id,temp:true,src:'yt',kind:'video',ref:v.id,title:c.title,artist:c.artist||'YouTube',thumb:`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`}; temp.set(t.id,t); out.push(t.id) };
    // karışım: ~3 sanatçının kendisinden, ~5 benzer/ilgili, ~2 benzer sanatçıdan
    shuf(own).slice(0,3).forEach(push); shuf(rel).forEach(v=>{ if(out.length<8) push(v) }); shuf(sim).forEach(v=>{ if(out.length<10) push(v) }); shuf(rel).forEach(v=>{ if(out.length<10) push(v) });
    if(out.length>=4){ discTaste=shuf(out); if(simA.length) discFrom=discFrom.concat(simA.slice(0,1)) } else discFailed=true;
  }catch{ discFailed=true }finally{ discBusy=false }
  if(view==='home') renderMain();
}
function discoverSongs(){
  if(tasteArtists().length&&!discFailed){
    if(discTaste) return discTaste.map(id=>temp.get(id)).filter(Boolean);
    buildTasteDiscover(); if(discBusy||!discTaste) return null;
  }
  DISC_GENRES.forEach(loadGenre);
  const ready=DISC_GENRES.filter(g=>Array.isArray(genreRes[g.k]));
  const pending=DISC_GENRES.some(g=>genreRes[g.k]==='loading');
  if(!discPick&&ready.length&&(!pending||ready.length>=3)){
    const known=new Set(history.slice(-200).map(h=>h.ref).concat(tracks.map(t=>t.ref)));
    const pool=[]; ready.forEach(g=>shuf(genreRes[g.k]).slice(0,8).forEach(t=>pool.push(t)));
    const fresh=shuf(pool).filter((t,i,a)=>a.findIndex(x=>x.ref===t.ref)===i);
    discPick=fresh.filter(t=>!known.has(t.ref)).concat(fresh.filter(t=>known.has(t.ref))).slice(0,10).map(t=>t.id);
  }
  return discPick?discPick.map(id=>temp.get(id)).filter(Boolean):null;
}

let libQ='';
function libList(){
  let L=tracks.slice();
  const q=norm(libQ); if(q) L=L.filter(t=>norm(t.title+' '+t.artist).includes(q));
  const srt=settings.libSort||'new';
  if(srt==='az') L.sort((a,b)=>a.title.localeCompare(b.title,'tr'));
  else if(srt==='artist') L.sort((a,b)=>(a.artist||'').localeCompare(b.artist||'','tr')||a.title.localeCompare(b.title,'tr'));
  else if(srt==='top'){ const c={}; history.forEach(h=>{c[h.ref]=(c[h.ref]||0)+1}); L.sort((a,b)=>(c[b.ref]||0)-(c[a.ref]||0)) }
  else L.sort((a,b)=>(b.added||0)-(a.added||0));
  return L;
}
function paintLib(){

let searchQ='', searchRes=[], homeDraft='', searchType='', searchArtist=null;
let searching=false;
async function doSearch(q){
  searchQ=q; if(!q){ searchRes=[]; renderMain(); return } searching=true; if(view!=='home'){view='home'} renderMain(); $('#main').scrollTop=0;
  try{
    {
      const ty=searchType; searchArtist=null;
      if(!ty) fetch('/api/artist?lite=1&q='+encodeURIComponent(q)).then(r=>r.json()).then(a=>{ if(a&&a.name&&searchQ===q){ searchArtist=a; if(view==='home') renderMain() } }).catch(()=>{});
      const j=await (await fetch('/api/search?q='+encodeURIComponent(q)+(ty?'&type='+ty:''))).json();
      if(j.error) throw new Error(j.error);
      searchRes=j.filter(v=>ty==='live'?v.live:ty==='podcast'?true:!v.live).map(v=>{const c=ty?{title:v.title,artist:v.channel}:cleanYT(v.title,v.channel);return {id:v.id,title:c.title,artist:c.artist||'YouTube',live:!!v.live,len:ty==='podcast'?v.duration:'',meta:viewMeta(v),thumb:`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`}});
    }
  }catch(e){searchRes=[];toast('Arama hatası: '+e.message,4500)}
  searching=false;
  searchRes.forEach(r=>{ const id='s:'+r.id; if(!temp.has(id)) temp.set(id,{id,temp:true,src:'yt',kind:'video',ref:r.id,title:r.title,artist:r.artist,thumb:r.thumb,live:r.live,len:r.len,meta:r.meta}) });
  if(view==='home') renderMain();
}

function viewMeta(v){
  let a=String(v.views||'').replace(/\s*görüntüleme$/i,' görüntülenme').replace(/\bviews?\b/i,'görüntülenme').replace(/\bwatching\b/i,'izliyor').trim();
  const b=String(v.age||'').replace(/^(Akış|Yayın) tarihi:?\s*/i,'').trim();
  return [a,b].filter(Boolean).join(' · ');
}

/* ================= Popups & modals ================= */
function closePop(){$$('.pop').forEach(p=>p.remove())}
function pop(x,y,html,onClick){
  closePop(); const p=document.createElement('div'); p.className='pop'; p.innerHTML=html; document.body.appendChild(p);
  const r=p.getBoundingClientRect(); p.style.left=Math.min(x,innerWidth-r.width-10)+'px'; p.style.top=Math.min(y,innerHeight-r.height-10)+'px';
  p.addEventListener('click',e=>{const b=e.target.closest('button');if(b){onClick(b.dataset.v);closePop()}});
  setTimeout(()=>document.addEventListener('click',closePop,{once:true}),0);
}
function ask(title,{value='',placeholder='',desc='',ok='Kaydet'}={}){
  return new Promise(res=>{
    const m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<form class="box"><h3>${title}</h3>${desc?`<p>${desc}</p>`:''}<input value="${esc(value)}" placeholder="${esc(placeholder)}"><div class="act"><button type="button" class="btn ghost" data-x>Vazgeç</button><button class="btn">${ok}</button></div></form>`;
    document.body.appendChild(m); const inp=m.querySelector('input'); inp.focus(); inp.select();
    const done=v=>{m.remove();res(v)};
    m.querySelector('form').onsubmit=e=>{e.preventDefault();done(inp.value.trim())};
    m.querySelector('[data-x]').onclick=()=>done(null);
    m.onclick=e=>{if(e.target===m)done(null)};
  });
}

      if(k==='alarmOn'){ settings.alarm.on=on; settings.alarm.fired=''; save(); const el=m.querySelector('#alNext'); if(el) el.textContent=nextAlarmText(); toast(on?nextAlarmText()||`Alarm kuruldu: ${settings.alarm.time}`:'Alarm kapatıldı',4000); return }
      settings[k]=on; save();

      return;
    }
    const sg=e.target.closest('.seg button');
    if(sg){ const seg=sg.parentElement; seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sg));

  });
  const esc1=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',esc1)}}; document.addEventListener('keydown',esc1);
}

/* ================= Always-on-top mini island (Document PiP) ================= */
async function togglePip(){
  if(pipWin){pipWin.close();return}
  if(!('documentPictureInPicture' in window)){toast('Bu özellik için Chrome veya Edge (güncel) gerekiyor',3500);return}
  try{
    pipWin=await documentPictureInPicture.requestWindow({width:380,height:64});
    const d=pipWin.document;
    [...document.styleSheets].forEach(ss=>{try{const s=d.createElement('style');s.textContent=[...ss.cssRules].map(r=>r.cssText).join('\n');d.head.appendChild(s)}catch{if(ss.href){const l=d.createElement('link');l.rel='stylesheet';l.href=ss.href;d.head.appendChild(l)}}});
    d.documentElement.style.setProperty('--acc',getComputedStyle(document.documentElement).getPropertyValue('--acc'));
    d.body.className='pip-body'; d.title='Nabız';
    const isl=islEl; isl.classList.remove('open'); isl.classList.add('in-pip'); d.body.appendChild(isl);
    pipWin.addEventListener('pagehide',()=>{isl.classList.remove('in-pip');document.body.prepend(isl);pipWin=null});
    toast('Mini pencereyi ekranın üst ortasına sürükle — her zaman üstte kalır',4000);
  }catch(e){pipWin=null;toast('Mini pencere açılamadı: '+e.message)}
}

const LY={key:'',status:'idle',lines:[],plain:'',idx:-1,tab:'queue',ldur:0};
function lyricQuery(){
  let t=(disp.title||'').replace(/\s*[\(\[][^\)\]]*[\)\]]/g,'').replace(/\s+(ft\.?|feat\.?|featuring)\s.+$/i,'').replace(/["“”]/g,'').trim();
  let a=(disp.artist||'').split(/\s*(?:,|&|\sx\s|\sve\s|feat\.?|ft\.?)\s*/i)[0].trim();
  return {t,a};
}
function parseLRC(txt){
  const out=[];
  for(const raw of String(txt||'').split(/\r?\n/)){
    const tags=[...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)]; if(!tags.length) continue;
    const text=raw.replace(/\[[^\]]*\]/g,'').trim();
    for(const m of tags) out.push({t:+m[1]*60+parseFloat(m[2].replace(':','.')),text:text||'♪'});
  }
  return out.sort((x,y)=>x.t-y.t);
}
/* ---- söz kaydırma: şarkıya özel, kalıcı ---- */
function lyKey(){ return (cur&&(curVideoId()||cur.ref))||'' }
function lyOff(){ const k=lyKey(); return k&&settings.lyOff&&settings.lyOff[k]||0 }
function setLyOff(v){ const k=lyKey(); if(!k||!LY.lines.length) return; v=Math.round(v*4)/4; settings.lyOff=settings.lyOff||{};
  if(Math.abs(v)<0.01) delete settings.lyOff[k]; else settings.lyOff[k]=v;
  const ks=Object.keys(settings.lyOff); if(ks.length>400) delete settings.lyOff[ks[0]];
  save(); LY.idx=-2; paintLyrics(true) }
function lyOffBar(){
  const o=lyOff(), d=dur&&LY.ldur?Math.round(dur-LY.ldur):0;

  return `<div class="lyoff"><span>Sözler:</span><button data-lyoff="-0.5" title="Sözler daha erken gelsin ( [ )">− erken</button><b>${fmtO}</b><button data-lyoff="0.5" title="Sözler daha geç gelsin ( ] )">geç +</button>${o?'<button data-lyoff="0">Sıfırla</button>':''}<span style="opacity:.7">· Shift + satıra tık: o satırı şimdiye hizala</span>${Math.abs(d)>=4&&!o?`<span class="warn">Bu video, sözlerin ait olduğu kayıttan ${Math.abs(d)} sn ${d>0?'uzun':'kısa'} (klip girişi olabilir); sözler kayarsa buradan ayarla.</span>`:''}</div>`;
}
function userLy(k){ return settings.userLyrics&&settings.userLyrics[k||LY.key]||null }
function setUserLy(k,v){ settings.userLyrics=settings.userLyrics||{};
  if(v) settings.userLyrics[k]={...v,at:Date.now()}; else delete settings.userLyrics[k];
  const ks=Object.keys(settings.userLyrics); if(ks.length>300) delete settings.userLyrics[ks.sort((x,y)=>settings.userLyrics[x].at-settings.userLyrics[y].at)[0]];
  save(); LY.key=''; loadLyrics(); }
async function loadLyrics(){
  if(!cur||!HTTP) return;
  const {t,a}=lyricQuery(); const key=(a+'|'+t).toLowerCase();
  if(!t||key===LY.key) return;
  LY.key=key; LY.status='loading'; LY.lines=[]; LY.plain=''; LY.idx=-1; LY.src=''; LY.auto=false; LY.ldur=0; paintLyrics(true);
  const u=userLy(key);
  if(u){ LY.lines=parseLRC(u.lrc); LY.plain=LY.lines.length?'':(u.plain||''); LY.src='user'; LY.status=LY.lines.length||LY.plain?'ok':'none'; paintLyrics(true); pushState(); return }
  try{
    const j=await (await fetch(`/api/lyrics?artist=${encodeURIComponent(a)}&title=${encodeURIComponent(t)}&duration=${Math.round(dur||0)}`)).json();
    if(LY.key!==key) return;
    LY.lines=parseLRC(j.synced); LY.plain=LY.lines.length?'':(j.plain||''); LY.ldur=+j.duration||0; LY.src=LY.lines.length||LY.plain?'lrclib':'';
  }catch{}
  if(LY.key!==key) return;
  if(!LY.lines.length){ // yedek: videonun altyazısı
    const id=curVideoId();
    if(id&&/^[\w-]{11}$/.test(id)) try{
      const c=await (await fetch(`/api/ytcaps?id=${encodeURIComponent(id)}`)).json();
      if(LY.key!==key) return;
      const L=parseLRC(c.synced);
      if(L.length>=4){ LY.lines=L; LY.plain=''; LY.src='yt'; LY.auto=!!c.auto; LY.ldur=0 }
    }catch{}
  }
  if(LY.key!==key) return;
  LY.status=LY.lines.length||LY.plain?'ok':'none';
  paintLyrics(true); pushState();
}

let LYS=null;
function startLySync(key,lines){

    <div class="lysPrev" style="opacity:.45;min-height:22px"></div><div class="lysNow" style="font-size:24px;font-weight:700;margin:8px 0;min-height:34px"></div><div class="lysNext" style="opacity:.6;min-height:22px"></div>

  document.body.appendChild(ov);

  const paint=()=>{ const i=LYS.stamps.length; ov.querySelector('.lysPrev').textContent=lines[i-1]||''; ov.querySelector('.lysNow').textContent=lines[i]||'Bitti ✓'; ov.querySelector('.lysNext').textContent=lines[i+1]||''; ov.querySelector('.lysPos').textContent=`${i} / ${lines.length} satır`; };
  const finish=()=>{ const lrc=LYS.stamps.map((t,i)=>{const mm=Math.floor(t/60),ss=(t%60).toFixed(2).padStart(5,'0');return `[${String(mm).padStart(2,'0')}:${ss}]${lines[i]}`}).join('\n');
    end(); setUserLy(key,{lrc}); toast('Zamanlı sözler kaydedildi 🎤',3500) };
  const tap=()=>{ if(!LYS) return; const t=Math.max(0,pos-0.15); const last=LYS.stamps[LYS.stamps.length-1]; LYS.stamps.push(last!=null&&t<last?last+0.1:t); paint(); if(LYS.stamps.length>=lines.length) setTimeout(finish,250) };

  const kd=e=>{ if(!LYS) return; if(e.code==='Space'||e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); tap() } else if(e.key==='Backspace'){ e.preventDefault(); e.stopPropagation(); undo() } else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); end() } };

  ov.querySelector('[data-x]').onclick=end; ov.querySelector('[data-undo]').onclick=undo; ov.querySelector('[data-tap]').onclick=tap;
  paint(); seekTo(0); if(!playing) toggle();
}

function metaTrack(x,cover){
  const id='q:'+norm(x.artist+' '+x.title); let t=temp.get(id);
  const ex=tracks.find(k=>norm(k.artist+' '+k.title)===norm(x.artist+' '+x.title)); if(ex) return ex;
  if(!t){ t={id,temp:true,src:'yt',kind:'video',ref:x.ytid||null,title:x.title,artist:x.artist,thumb:x.cover||cover||'',dur:x.duration||0,query:`${x.artist} ${x.title}`}; temp.set(id,t) }
  return t;
}
function loadArtist(name){
  const k=norm(name); const ck=k+'|'+norm(artistHint.get(k)||''); if(artistData.has(ck)) return artistData.get(ck);
  const st={loading:true}; artistData.set(ck,st);
  const ht=artistHint.get(k);
  fetch('/api/artist?q='+encodeURIComponent(name)+(ht?'&t='+encodeURIComponent(ht):'')).then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error); artistData.set(ck,j) })
    .catch(e=>artistData.set(ck,{error:e.message||'Bağlantı hatası'})).finally(()=>{ if(view==='artist:'+name) renderMain() });
  return st;
}
const curArtist=()=>{ const k=norm(view.slice(7)); return artistData.get(k+'|'+norm(artistHint.get(k)||'')) };
function artistIds(){ const d=curArtist()||{}; return (d.top||[]).map(x=>metaTrack(x).id) }

async function songRadio(t){
  if(!t) return; if(!navigator.onLine){ toast('İnternet yok'); return }
  if(t.src==='yt'&&!t.ref&&!(await resolveYT(t))){ toast('Bu şarkı YouTube\'da bulunamadı'); return }
  playTrack(t.id,[t.id]); toast('Radyo hazırlanıyor: '+t.title);
  try{
    const j=await (await fetch('/api/related?id='+encodeURIComponent(t.ref))).json();
    const picks=(Array.isArray(j)?j:[]).filter(v=>{const sec=toSec(v.duration);return v.id!==t.ref&&sec>60&&sec<600&&!isBanned(v.id)}).slice(0,25);
    if(!picks.length){ toast('Benzer şarkı bulunamadı'); return }
    const ids=picks.map(v=>{const c=cleanYT(v.title,v.channel);const r={id:'r:'+v.id,temp:true,radio:true,src:'yt',kind:'video',ref:v.id,title:c.title,artist:c.artist||'YouTube',thumb:`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`};temp.set(r.id,r);return r.id});
    if(cur&&cur.id===t.id){ queue=[t.id,...ids]; qi=0; renderQueue(); setRightTab('queue'); toast(`"${t.title}" radyosu: ${ids.length} benzer şarkı sırada`,3000) }
  }catch{ toast('Radyo başlatılamadı') }
}

/* ================= Arama önerileri (ana sayfa + sol kutu) ================= */
(()=>{ let tm, items=[], sel=-1, lastQ='', inp=null;
  const IDS=['homeIn','sideIn'];
  const box=()=>document.getElementById('sugg');
  const close=()=>{ const b=box(); if(b) b.remove(); items=[]; sel=-1 };
  const paint=()=>{ if(!inp||!document.body.contains(inp)) return close(); const f=inp.closest('form'); let b=box();
    if(!items.length){ close(); return }
    if(b&&b.parentNode!==f){ b.remove(); b=null }
    if(!b){ b=document.createElement('div'); b.id='sugg'; b.className='sugg'; f.appendChild(b) }
    b.innerHTML=items.map((x,i)=>`<button type="button" data-sg="${i}" class="${i===sel?'on':''}">${I.search}${esc(x)}</button>`).join('') };
  const pick=i=>{ const v=items[i]; if(v==null) return; inp.value=v; homeDraft=v; close(); if(inp.id==='sideIn') inp.blur(); if(view!=='home') view='home'; doSearch(v) };
  document.addEventListener('input',e=>{ if(!IDS.includes(e.target.id)) return; inp=e.target; const q=inp.value.trim(); clearTimeout(tm);
    if(!q||/^https?:|youtu/i.test(q)){ close(); return }
    tm=setTimeout(async()=>{ lastQ=q; try{ const j=await (await fetch('/api/suggest?q='+encodeURIComponent(q))).json(); if(lastQ!==q||document.activeElement!==inp) return; items=(Array.isArray(j)?j:[]).filter(x=>norm(x)!==norm(q)||j.length===1).slice(0,8); sel=-1; paint() }catch{} },180) });
  document.addEventListener('keydown',e=>{ if(!IDS.includes(e.target.id)||!box()) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); sel=(sel+1)%items.length; paint() }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=sel<=0?items.length-1:sel-1; paint() }
    else if(e.key==='Enter'&&sel>=0){ e.preventDefault(); e.stopPropagation(); pick(sel) }
    else if(e.key==='Escape'){ e.stopPropagation(); close() } },true);
  document.addEventListener('mousedown',e=>{ const b=e.target.closest('[data-sg]'); if(b){ e.preventDefault(); pick(+b.dataset.sg) } });
  document.addEventListener('focusout',e=>{ if(IDS.includes(e.target.id)) setTimeout(close,120) });
  document.addEventListener('submit',()=>{ clearTimeout(tm); lastQ=''; close() },true);
})();

/* ================= Kitaplık kaldırıldı: sadece Ekle ile tutulan şarkılar kaybolmasın ================= */
function libCleanup(){
  const inAny=new Set(playlists.flatMap(p=>p.ids)); const orphan=t=>!liked.has(t.id)&&!inAny.has(t.id);
  if(!settings.libGone){ settings.libGone=true;
    const O=tracks.filter(orphan).sort((a,b)=>(b.added||0)-(a.added||0));
    if(O.length){ playlists.push({id:uid(),name:'Kaydettiklerim',ids:O.map(t=>t.id)}); save(); renderSidebar(); toast(`Kitaplıktaki ${O.length} şarkın “Kaydettiklerim” listesine taşındı`,5000) } else save();
    return }
  // artık hiçbir listede ya da beğenide olmayan şarkılar arka planda temizlenir (sıra/çalan hariç)
  const keepIds=new Set(queue.concat(cur?[cur.id]:[]));
  const before=tracks.length; tracks=tracks.filter(t=>!orphan(t)||keepIds.has(t.id)); if(tracks.length!==before) save();
}

/* ================= Hatıralar: geçen yıl / 6 ay / 1 ay önce bugün ================= */
function dayRange(daysAgo){ const d=new Date(); d.setHours(0,0,0,0); if(daysAgo===365) d.setFullYear(d.getFullYear()-1); else if(daysAgo===180) d.setMonth(d.getMonth()-6); else if(daysAgo===30) d.setMonth(d.getMonth()-1); else d.setDate(d.getDate()-daysAgo); return [d.getTime(),d.getTime()+864e5] }
function memoriesHTML(){
  if(history.length<20) return '';
  const out=[];
  for(const [n,lbl] of [[365,'Geçen yıl bugün'],[180,'6 ay önce bugün'],[30,'1 ay önce bugün']]){
    const [a,b]=dayRange(n); const st=histStats(a,h=>h.at<b).sort((x,y)=>y.n-x.n||y.secs-x.secs);
    if(!st.length) continue; const e=st[0], t=histTrack(e.h);
    out.push({lbl,t,n:st.length,first:t.id,ids:st.slice(0,25).map(x=>histTrack(x.h).id)});
  }
  if(!out.length) return '';
  return `<div class="h2" style="margin-top:30px">Hatıralar <span class="src-note">o gün en çok dinlediğin şarkı</span></div>
    <div class="memos">${out.map(o=>`<div class="memo" data-id="${o.t.id}" data-list="${o.ids.join(',')}">${o.t.thumb?`<img src="${esc(o.t.thumb)}" loading="lazy">`:'<div class="ph"></div>'}<div style="min-width:0"><small>${o.lbl}</small><b>${esc(o.t.title)}</b><span>${esc(o.t.artist||'')}${o.n>1?` · o gün ${o.n} farklı şarkı`:''}</span></div></div>`).join('')}</div>`;
}

/* ================= Aylık zaman kapsülü ================= */
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const capName=m=>{ const [y,mo]=m.split('-'); return `${AYLAR[+mo-1]} ${y}` };
function capIds(m){ const c=(settings.capsules||[]).find(x=>x.m===m); return c?c.items.map(it=>{ const id='c:'+it.ref; if(!temp.has(id)) temp.set(id,{id,temp:true,src:'yt',kind:'video',...it}); return id }):[] }
function buildCapsules(){
  if(!history.length) return;
  settings.capsules=settings.capsules||[]; const have=new Set(settings.capsules.map(c=>c.m));
  const now=new Date(), curKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const byM=new Map();
  for(const h of history){ if(!h.ref) continue; const d=new Date(h.at); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); if(k===curKey||have.has(k)) continue; (byM.get(k)||byM.set(k,[]).get(k)).push(h) }
  let added=0;
  for(const [k,H] of [...byM.entries()].sort()){
    const m=new Map(); H.forEach(h=>{ const e=m.get(h.ref)||{h,n:0,secs:0}; e.n++; e.secs+=h.secs||0; m.set(h.ref,e) });
    const top=[...m.values()].sort((a,b)=>b.n-a.n||b.secs-a.secs).slice(0,30);
    if(top.length<5) continue;
    settings.capsules.push({m:k,at:Date.now(),items:top.map(e=>({ref:e.h.ref,title:e.h.title,artist:e.h.artist,thumb:e.h.thumb}))}); added++;
  }
  if(added){ settings.capsules.sort((a,b)=>a.m.localeCompare(b.m)); save(); const last=settings.capsules.at(-1); setTimeout(()=>toast(`⏳ Zaman kapsülün hazır: ${capName(last.m)} — Senin için bölümünde`,4500),2500) }
}

/* ================= Seri + başarımlar ================= */
function streak(){
  const days=new Set(history.map(h=>{ const d=new Date(h.at); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate() }));
  const key=d=>d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
  const d=new Date(); const today=days.has(key(d)); if(!today) d.setDate(d.getDate()-1);
  let n=0; while(days.has(key(d))){ n++; d.setDate(d.getDate()-1) }
  let best=0, run=0, prev=null; [...days].map(k=>{const [y,m,dd]=k.split('-');return new Date(+y,+m,+dd).getTime()}).sort((a,b)=>a-b).forEach(t=>{ run=prev!=null&&Math.round((t-prev)/864e5)===1?run+1:1; best=Math.max(best,run); prev=t });
  return {n,today,best};
}
let bstatCache=null;
function bstats(){
  if(bstatCache&&bstatCache.len===history.length&&bstatCache.pl===playlists.length&&bstatCache.lk===liked.size) return bstatCache;
  const secs=history.reduce((a,h)=>a+(h.secs||0),0), artists=new Map(), songs=new Map(), dayS=new Map(); let night=0, early=0;
  for(const h of history){ const a=mainArtist(h.artist)||h.artist||'?'; artists.set(a,(artists.get(a)||0)+(h.secs||0)); songs.set(h.ref||h.title,(songs.get(h.ref||h.title)||0)+1);
    const d=new Date(h.at), hr=d.getHours(); if(hr>=2&&hr<5) night++; if(hr>=5&&hr<7) early++; const dk=d.toDateString(); dayS.set(dk,(dayS.get(dk)||0)+(h.secs||0)) }
  return bstatCache={len:history.length,pl:playlists.length,lk:liked.size,plays:history.length,hours:secs/3600,artists:artists.size,topArtistH:Math.max(0,...artists.values())/3600,topSong:Math.max(0,...songs.values()),night,early,bestDayH:Math.max(0,...dayS.values())/3600,streak:streak().best,lists:playlists.length,likes:liked.size};
}

function checkBadges(silent){

  x.fillStyle='#fff'; x.font=`800 ${fs}px Outfit, sans-serif`; x.shadowColor='rgba(0,0,0,.35)'; x.shadowBlur=24;

  if(at!=null&&at>=0){
    const ty=top+blockH+fs*0.55+40, bw=W-P*2-300, D=dur>0?dur:0;

}

  if(act==='x') return clearSel();

  if(act==='unlike'){ const was=ids.filter(id=>liked.has(id)); was.forEach(id=>liked.delete(id)); save(); renderAll(); clearSel();
    undoToast(`${was.length} şarkı beğenilerden çıkarıldı`,()=>{ was.forEach(id=>liked.add(id)); save(); renderAll() }); return }
  if(act==='unpl'){ const pl=playlists.find(p=>'pl:'+p.id===view); if(!pl) return; const before=pl.ids.slice(); pl.ids=pl.ids.filter(id=>!ids.includes(id)); save(); renderAll(); clearSel();
    undoToast(`${before.length-pl.ids.length} şarkı listeden çıkarıldı`,()=>{ pl.ids=before; save(); renderAll() }); return }
  if(act==='del'){ const snap={tracks:tracks.slice(),liked:new Set(liked),pls:playlists.map(p=>[p,p.ids.slice()])};
    tracks=tracks.filter(t=>!ids.includes(t.id)); ids.forEach(id=>liked.delete(id)); playlists.forEach(p=>p.ids=p.ids.filter(id=>!ids.includes(id))); save(); renderAll(); clearSel();
    undoToast(`${snap.tracks.length-tracks.length} şarkı kitaplıktan kaldırıldı`,()=>{ tracks=snap.tracks; liked=snap.liked; snap.pls.forEach(([p,a])=>p.ids=a); save(); renderAll() }); return }
});

function startTour(){
  if(document.querySelector('.tour')) return;
  if(view!=='home'){ view='home'; renderMain() } $('#main').scrollTop=0;
  const desk=!!(window.ada&&ada.getDesk);
  const S=[
    {sel:'#homeForm',t:'Ara',d:'Şarkı, sanatçı ya da bir YouTube linki yaz. Yazarken öneriler çıkar. Spotify ya da Deezer listesi linki yapıştırırsan listeyi Nabız\'a aktarır.'},
    {sel:'.fyc.flow',t:'Akış',d:'Ne dinleyeceğini bilmiyorsan buradan başla: tek dokunuşla sana göre, bitmeyen bir müzik akışı. Dinledikçe ve beğendikçe daha iyi tanır.'},
    {sel:'.bar',t:'Çalma çubuğu',d:'Kapağa ya da şarkının adına tıkla: video büyük ekranda açılır. Kalp şarkıyı beğenir, yanındaki düğme bir listeye ekler. Sanatçının adına tıklarsan sanatçı sayfası açılır.'},
    {sel:'.right',t:'Sıradakiler ve sözler',d:'Sırayı sürükleyerek düzenle. “Sözler” sekmesinde şarkı sözleri şarkıyla birlikte akar; çalma hızı ve altyazı da burada.'},
    {sel:'#newPl',t:'Çalma listelerin',d:'+ ile yeni liste aç, Spotify/Deezer listeni içe aktar ya da bir arkadaşının paylaştığı kodu ekle. Şarkıları kartlardan sürükleyip listelere bırakabilirsin.'},
    ...(desk?[{sel:null,t:'Masaüstü adası',d:'Ekranın üstündeki küçük ada, Nabız kapalıyken bile çalan şarkıyı gösterir. Sürükleyerek taşı, tekerlekle sesi ayarla, çift tıkla durdur. Ctrl+Alt+N ile aç/kapat.<br><br><b>Oyunlarda görünmesi için</b> oyunun ekran modunu <b>Çerçevesiz</b> ya da <b>Pencereli</b> yap; “Tam ekran” modunda Windows adayı oyunun üstünde gösteremez.'}]:[]),
    {sel:'.side-foot',t:'Ayarlar ve rehber',d:'Tema, gizli oturum ve telefondan kumanda burada. Bu turu ve bütün ipuçlarını Ayarlar → Uygulama → Rehber\'den her zaman tekrar açabilirsin. İyi dinlemeler! 🎧'},
  ];
  const vis=sel=>{ if(!sel) return null; const el=document.querySelector(sel); if(!el) return null; const r=el.getBoundingClientRect(); return r.width>8&&r.height>8&&getComputedStyle(el).display!=='none'?r:null };
  const steps=S.filter(x=>!x.sel||vis(x.sel));
  const o=document.createElement('div'); o.className='tour';
  o.innerHTML='<div class="tour-hole"></div><div class="tour-tip"></div>'; document.body.appendChild(o);
  const hole=o.querySelector('.tour-hole'), tip=o.querySelector('.tour-tip'); let i=0;
  const place=()=>{ const st=steps[i]; const r=vis(st.sel); const P=10;
    if(r){ hole.classList.remove('none'); Object.assign(hole.style,{left:r.left-P+'px',top:r.top-P+'px',width:r.width+P*2+'px',height:r.height+P*2+'px'}) }
    else { hole.classList.add('none'); Object.assign(hole.style,{left:innerWidth/2+'px',top:innerHeight/2+'px'}) }
    tip.innerHTML=`<small>${i+1} / ${steps.length}</small><h3>${st.t}</h3><p>${st.d}</p><div class="tb"><div class="dots">${steps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>${i>0?'<button class="sk" data-b>Geri</button>':'<button class="sk" data-s>Turu geç</button>'}<button class="nx" data-n>${i===steps.length-1?'Bitir':'İleri'}</button></div>`;
    const tw=tip.offsetWidth, th=tip.offsetHeight; let x,y;
    if(!r){ x=(innerWidth-tw)/2; y=(innerHeight-th)/2 }
    else { const below=r.bottom+P+14, above=r.top-P-14-th, right=r.right+P+14;
      if(below+th<innerHeight-10){ y=below; x=r.left } else if(above>10){ y=above; x=r.left } else { y=Math.min(innerHeight-th-10,Math.max(10,r.top)); x=right+tw<innerWidth?right:r.left-tw-P-14 } }
    tip.style.left=Math.max(10,Math.min(innerWidth-tw-10,x))+'px'; tip.style.top=Math.max(10,y)+'px' };
  const end=()=>{ o.remove(); settings.tourDone=1; save(); removeEventListener('resize',place); document.removeEventListener('keydown',key,true) };
  const key=e=>{ if(e.key==='Escape'){ e.stopPropagation(); end() } else if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); i<steps.length-1?(i++,place()):end() } else if(e.key==='ArrowLeft'&&i>0){ e.stopPropagation(); i--; place() } };
  o.addEventListener('click',e=>{ if(e.target.closest('[data-n]')){ if(i<steps.length-1){ i++; place() } else end() } else if(e.target.closest('[data-b]')){ i--; place() } else if(e.target.closest('[data-s]')) end() });
  addEventListener('resize',place); document.addEventListener('keydown',key,true);
  place();
}

const FB_LABELS=['','Hiç beğenmedim','Pek iyi değil','Fena değil','Güzel','Bayıldım!'];
function openFeedback(pre){
  if(!(window.ada&&ada.feedback)){ toast('Geri bildirim için Nabız uygulamasını kullan'); return }
  const last=settings.fbSent; if(last&&Date.now()-last.at<10*60e3){ toast('Teşekkürler, az önce gönderdin! Biraz sonra tekrar yazabilirsin.',3500); return }
  let stars=pre||0;
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<form class="box fbbox" style="width:min(500px,94vw)"><h3>Nabız'ı nasıl buldun?</h3><p>Puanın ve düşüncelerin doğrudan Nabız'ın geliştiricisine gider.</p>
    <div class="fbstars" role="radiogroup" aria-label="Puan">${[1,2,3,4,5].map(i=>`<button type="button" data-st="${i}" aria-label="${i} yıldız">★</button>`).join('')}</div>
    <div class="fblab" id="fbLab">Yıldızlara dokun</div>
    <textarea id="fbText" placeholder="Düşüncelerin (isteğe bağlı): neyi sevdin, ne eksik, ne eklenmeli?" style="min-height:110px"></textarea>
    <input id="fbName" placeholder="İsmin (isteğe bağlı)" value="${esc(settings.reportName||'')}" style="margin-top:10px">
    <div class="act"><button type="button" class="btn ghost" data-x>Vazgeç</button><button class="btn" id="fbSend" disabled>Gönder</button></div></form>`;
  document.body.appendChild(m);
  const paint=h=>{ const v=h||stars; m.querySelectorAll('[data-st]').forEach(b=>b.classList.toggle('on',+b.dataset.st<=v)); m.querySelector('#fbLab').textContent=v?FB_LABELS[v]:'Yıldızlara dokun'; m.querySelector('#fbSend').disabled=!stars };
  m.querySelectorAll('[data-st]').forEach(b=>{ b.onclick=()=>{ stars=+b.dataset.st; paint(); m.querySelector('#fbText').focus() }; b.onmouseenter=()=>paint(+b.dataset.st); b.onmouseleave=()=>paint() });
  paint();
  m.querySelector('[data-x]').onclick=()=>m.remove(); m.onclick=e=>{ if(e.target===m) m.remove() };
  m.querySelector('form').onsubmit=async e=>{ e.preventDefault(); if(!stars){ toast('Önce yıldız seç'); return }
    const name=m.querySelector('#fbName').value.trim(); if(name){ settings.reportName=name; }
    const b=m.querySelector('#fbSend'); b.disabled=true; b.textContent='Gönderiliyor…';
    const r=await ada.feedback({stars,text:m.querySelector('#fbText').value.trim(),name}).catch(er=>({ok:false,error:er.message}));
    if(r&&r.ok){ settings.fbSent={at:Date.now(),stars}; settings.fbAsked=1; save(); m.remove(); toast(stars>=4?'Teşekkürler! 💜 Beğenmene çok sevindik.':'Teşekkürler! Yazdıkların Nabız\'ı daha iyi yapmak için okunacak.',4000) }
    else { b.disabled=false; b.textContent='Gönder'; toast('Gönderilemedi: '+(r&&r.error||'bilinmeyen hata'),4500) } };
}
// bir kez, nazikçe: birkaç gün kullanıp yeterince dinleyene sor (yönetici hariç)
function maybeAskFeedback(){
  if(settings.fbAsked||settings.fbSent||isAdminUser||!(window.ada&&ada.feedback)) return;
  const first=history.length?history[0].at:Date.now(); if(Date.now()-first<3*864e5||history.length<40) return;
  if(document.querySelector('.modal,.tour,.fbask')) return;
  settings.fbAsked=1; save();
  const d=document.createElement('div'); d.className='fbask';
  d.innerHTML=`<b>Nabız'ı nasıl buldun?</b><div class="fbstars sm">${[1,2,3,4,5].map(i=>`<button data-st="${i}">★</button>`).join('')}</div><button class="x" title="Kapat">✕</button>`;
  document.body.appendChild(d);
  d.querySelectorAll('[data-st]').forEach(b=>{ b.onmouseenter=()=>d.querySelectorAll('[data-st]').forEach(x=>x.classList.toggle('on',+x.dataset.st<=+b.dataset.st)); b.onclick=()=>{ d.remove(); openFeedback(+b.dataset.st) } });
  d.querySelector('.fbstars').onmouseleave=()=>d.querySelectorAll('[data-st]').forEach(x=>x.classList.remove('on'));
  d.querySelector('.x').onclick=()=>d.remove();
  setTimeout(()=>d.remove(),45000);
}
setTimeout(maybeAskFeedback,90000);

function adminHTML(){

      <li>Discord'da Ayarlar → Gelişmiş → <b>Geliştirici Modu</b>'nu aç; bildirim kanalına sağ tıkla → <b>Kanal ID'sini Kopyala</b>.</li></ol>
    <input id="admTok" type="password" placeholder="Bot anahtarı (token)" autocomplete="off"><input id="admCh" placeholder="Kanal ID" value="${esc(admInfo.channel||'')}" autocomplete="off">
    <button class="btn" id="admSave">Kaydet ve bağlan</button> ${admInfo.ready?'<button class="btn ghost" id="admCancel">Vazgeç</button>':''}
    <p class="sub" style="margin-top:12px;font-size:12px">Bot anahtarı sadece bu bilgisayarda saklanır; güncellemelerle hiçbir yere gönderilmez.${admInfo.hook?'':' <br><b style="color:#ffcf85">Not:</b> Arkadaşlarının Nabız\'ının sinyal göndereceği webhook adresi henüz yayınlanmadı.'}</p></div>`;
  if(!adm) return head+'<div class="sub">Discord\'dan veriler alınıyor…</div>';
  if(adm.error) return head+`<div class="adm-warn">${esc(adm.error)}</div><button class="btn ghost" id="admSetup2">Bağlantı ayarlarını aç</button>`;
  const D=864e5, now=Date.now(), today=new Date(); today.setHours(0,0,0,0);
  const U=new Map(); for(const b of adm.beats){ const u=U.get(b.id)||{id:b.id,first:b.at,last:0,ver:'',os:'',days:new Set()}; u.first=Math.min(u.first,b.at); if(b.at>u.last){ u.last=b.at; u.ver=b.ver; u.os=b.os } u.days.add(new Date(b.at).toDateString()); U.set(b.id,u) }
  for(const r of adm.reports){ const u=U.get(r.id); if(u&&r.name) u.name=r.name; }
  const users=[...U.values()].sort((a,b)=>b.last-a.last);
  const cnt=ms=>users.filter(u=>u.last>=ms).length;
  const latest=users.map(u=>u.ver).sort((a,b)=>{ const x=a.split('.').map(Number),y=b.split('.').map(Number); for(let i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (y[i]||0)-(x[i]||0) } return 0 })[0]||'';
  const vers={}; users.forEach(u=>vers[u.ver]=(vers[u.ver]||0)+1);
  const ago=t=>{ const m=(now-t)/6e4; return m<60?Math.max(1,Math.round(m))+' dk önce':m<1440?Math.round(m/60)+' sa önce':Math.round(m/1440)+' gün önce' };
  const uname=id=>{ const u=U.get(id); return (id===adm.me?'Sen':u&&u.name?esc(u.name):'Kullanıcı')+' <span style="color:var(--mut)">#'+id.slice(0,4).toUpperCase()+'</span>' };
  const seen=settings.admSeen||0;
