let flowOn=false, flowBusy=false;
function flowSeeds(){
  const fav=histStats(Date.now()-60*864e5).sort((a,b)=>b.n-a.n).slice(0,25).map(e=>e.h.ref);
  const lk=tracks.filter(t=>liked.has(t.id)&&t.ref).map(t=>t.ref);
  const recentFlow=queue.slice(Math.max(0,qi-3),qi+1).map(byId).filter(t=>t&&t.ref&&t.flow).map(t=>t.ref);
  return [...new Set(shuf(recentFlow).concat(shuf(fav).slice(0,6),shuf(lk).slice(0,6)))].filter(r=>!isBanned(r));
}
async function flowBatch(n){
  let seeds=flowSeeds().slice(0,3);
  if(!seeds.length&&(settings.seedArtists||[]).length) seeds=await seedArtistRefs(3);
  if(!seeds.length){ try{ const j=await (await fetch('/api/search?q='+encodeURIComponent('türkçe pop yeni şarkılar'))).json(); seeds=shuf((Array.isArray(j)?j:[]).filter(v=>!v.live).map(v=>v.id)).slice(0,2) }catch{} }
  const played=new Set(history.slice(-80).map(h=>h.ref).concat(queue.map(id=>byId(id)&&byId(id).ref)));
  let pool=[];
  for(const sd of seeds){ try{ const j=await (await fetch('/api/related?id='+encodeURIComponent(sd))).json(); if(Array.isArray(j)) pool=pool.concat(j) }catch{} }
  const seen=new Set(), out=[];
  for(const v of shuf(pool)){ const sec=toSec(v.duration); if(seen.has(v.id)||played.has(v.id)||isBanned(v.id)||sec<60||sec>600||v.live) continue; seen.add(v.id);
    const c=cleanYT(v.title,v.channel); const t={id:'f:'+v.id,temp:true,flow:true,src:'yt',kind:'video',ref:v.id,title:c.title,artist:c.artist||'YouTube',thumb:`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`}; temp.set(t.id,t); out.push(t.id); if(out.length>=n) break }
  // Deezer Flow gibi: arada bir sevdiğin bir şarkı
  const fav=histStats(Date.now()-90*864e5).filter(e=>e.n>=2&&!played.has(e.h.ref)&&!isBanned(e.h.ref)).sort(()=>Math.random()-.5).slice(0,Math.max(1,Math.round(n/4)));
  fav.forEach(e=>{ const t=histTrack(e.h); t.flow=true; out.splice(Math.floor(Math.random()*(out.length+1)),0,t.id) });
  return out;
}
async function startFlow(){
  if(!navigator.onLine){ toast('İnternet yok'); return } if(flowBusy) return; flowBusy=true; toast('Akış hazırlanıyor…');
  try{ const ids=await flowBatch(8); if(!ids.length){ toast('Akış şu an başlatılamadı'); return }
    shuffle=false; paintModes(); playTrack(ids[0],ids); flowOn=true; renderQueue(); renderMain(); setRightTab('queue'); toast('Akış başladı: sana göre, bitmeden çalar',3000) }

}
async function flowRefill(){
  if(flowBusy) return; flowBusy=true;
  try{ const ids=await flowBatch(8); if(flowOn&&ids.length){ queue=queue.concat(ids.filter(id=>!queue.includes(id))); renderQueue() } }finally{ flowBusy=false }
}

let dlyBusy=false;
function cleanTA(title,artist){
  const t=(title||'').replace(/\s*[\(\[][^\)\]]*[\)\]]/g,'').replace(/\s+(ft\.?|feat\.?|featuring)\s.+$/i,'').replace(/["“”]/g,'').replace(/\s*[-–|]\s*(official|lyric|lyrics|audio|video|klip).*$/i,'').trim();
  const a=(artist||'').replace(/\s*-\s*Topic$/i,'').split(/\s*(?:,|&|\sx\s|\sve\s|feat\.?|ft\.?)\s*/i)[0].trim();
  return {t,a};
}
function dayLyricCands(){
  const since=Date.now()-90*864e5, by=new Map();
  for(const h of history){ if(!h.ref||h.at<since||(h.secs||0)<30) continue; const e=by.get(h.ref)||{h,n:0}; e.n++; e.h=h; by.set(h.ref,e) }
  return [...by.values()].filter(e=>e.n>=2).sort((x,y)=>y.n-x.n).slice(0,12).map(e=>e.h);
}
function pickLine(lines,seed){
  const ok=lines.filter(l=>{ const n=l.text.length; return n>=14&&n<=80&&!/^[♪\s]*$/.test(l.text)&&!/^\(.*\)$/.test(l.text) });
  if(!ok.length) return null;
  const cnt=new Map(); ok.forEach(l=>{ const k=norm(l.text); cnt.set(k,(cnt.get(k)||0)+1) });
  const best=Math.max(...cnt.values()); let pool=ok.filter(l=>cnt.get(norm(l.text))===best);  // nakarat önce
  const seen=new Set(); pool=pool.filter(l=>{ const k=norm(l.text); if(seen.has(k)) return false; seen.add(k); return true });
  return pool[seed%pool.length];
}
async function buildDayLyric(force){
  if(dlyBusy||!HTTP) return; const day=dayKey(); const c=settings.dayLy;
  if(!force&&c&&(c.day===day||c.none===day)) return;
  const cands=dayLyricCands(); if(!cands.length){ settings.dayLy={none:day}; return }
  dlyBusy=true;
  try{
    const seed=[...day].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0,7)+(force?Math.floor(Math.random()*1e6):0);
    const skip=force&&c&&c.ref; const order=cands.map((h,i)=>cands[(i+seed)%cands.length]).filter(h=>h.ref!==skip||cands.length===1);
    for(const h of order.slice(0,5)){
      const {t,a}=cleanTA(h.title,h.artist); if(!t) continue;
      let lines=[];
      const u=userLy((a+'|'+t).toLowerCase()); if(u&&u.lrc) lines=parseLRC(u.lrc);
      if(!lines.length) try{ const j=await (await fetch(`/api/lyrics?artist=${encodeURIComponent(a)}&title=${encodeURIComponent(t)}`)).json(); lines=parseLRC(j.synced) }catch{}
      const L=pickLine(lines,seed); if(!L) continue;
      const off=settings.lyOff&&settings.lyOff[h.ref]||0;
      settings.dayLy={day,ref:h.ref,title:h.title,artist:h.artist,thumb:h.thumb,text:L.text,t:Math.max(0,L.t+off)}; save(); break;
    }
    if(!settings.dayLy||settings.dayLy.day!==day){ settings.dayLy={none:day}; save() }
  }finally{ dlyBusy=false }
  if(view==='home') renderMain();
}

  if(!d||d.day!==dayKey()||!d.text) return '';
  return `<div class="h2" style="margin-top:30px">Günün sözü <span class="src-note">en çok dinlediklerinden</span></div>

async function createImported(name,list,{fromCode=false}={}){
  const ids=[]; const fresh=[];
  for(const x of list){
    if(!x.title) continue;
    let t=(x.ref&&tracks.find(k=>k.ref===x.ref))||tracks.find(k=>norm(k.artist+' '+k.title)===norm(x.artist+' '+x.title));
    if(!t){ t={id:uid(),src:'yt',kind:'video',ref:x.ref||null,url:x.ref?`https://www.youtube.com/watch?v=${x.ref}`:'',title:x.title,artist:x.artist||'',thumb:x.thumb||(x.ref?`https://i.ytimg.com/vi/${x.ref}/hqdefault.jpg`:x.cover||''),dur:x.duration||0,query:x.artist?`${x.artist} ${x.title}`:x.title,added:Date.now()}; tracks.push(t); if(!t.ref) fresh.push(t) }
    if(!ids.includes(t.id)) ids.push(t.id);
  }
  if(!ids.length){ toast('Listede şarkı bulunamadı'); return null }
  const pl={id:uid(),name,ids}; playlists.push(pl); save(); renderSidebar(); view='pl:'+pl.id; renderMain(); $('#main').scrollTop=0;
  toast(`"${name}" oluşturuldu: ${ids.length} şarkı${fresh.length?' · YouTube\'da eşleştiriliyor…':''}`,4000);
  if(fresh.length) bgResolve(fresh,pl);
  return pl;
}
async function bgResolve(list,pl){
  let ok=0, i=0;
  const work=async()=>{ while(i<list.length){ const t=list[i++]; if(t.ref){ok++;continue} if(await resolveYT(t)){ ok++; if(ok%5===0){ save(); renderSidebar(); if(view==='pl:'+pl.id) renderMain() } } } };
  await Promise.all([work(),work(),work()]);
  save(); renderSidebar(); if(view==='pl:'+pl.id) renderMain();
  toast(`"${pl.name}": ${ok}/${list.length} şarkı YouTube'da eşleşti${ok<list.length?' (kalanlar çalınırken tekrar denenecek)':''}`,5000);
}

function askText(title,desc,placeholder){
  return new Promise(res=>{ const m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<form class="box" style="width:min(560px,94vw)"><h3>${title}</h3><p>${desc}</p><input id="atName" placeholder="Liste adı" style="margin-bottom:10px"><textarea placeholder="${esc(placeholder)}"></textarea><div class="act"><button type="button" class="btn ghost" data-x>Vazgeç</button><button class="btn">Oluştur</button></div></form>`;
    document.body.appendChild(m); m.querySelector('textarea').focus();
    const done=v=>{m.remove();res(v)};
    m.querySelector('form').onsubmit=e=>{e.preventDefault();done({name:m.querySelector('#atName').value.trim(),text:m.querySelector('textarea').value})};
    m.querySelector('[data-x]').onclick=()=>done(null); m.onclick=e=>{if(e.target===m)done(null)} });

async function importText(){
  const r=await askText('Şarkı adlarından liste oluştur','Her satıra bir şarkı yaz: <b>Sanatçı - Şarkı</b>. YouTube linkleri de olur. Başka bir uygulamadan şarkı listesini kopyalayıp yapıştırabilirsin.','Sezen Aksu - Gidiyorum\nMabel Matiz - Antidepresan\nTarkan - Kuzu Kuzu'); if(!r||!r.text.trim()) return;
  const list=r.text.split(/\r?\n/).map(l=>l.replace(/^\s*\d+[.)-]\s*/,'').trim()).filter(Boolean).slice(0,500).map(l=>{
    if(/open\.spotify\.com\/track/.test(l)) return null;
    const yt=parseLink(l); if(yt&&yt.kind==='video'&&/youtu/.test(l)) return {ref:yt.ref,title:'YouTube videosu',artist:''};
    const m=l.split(/\s+[-–—]\s+/); return m.length>=2?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{artist:'',title:l} }).filter(Boolean);
  const pl=await createImported(r.name||'Yeni liste '+new Date().toLocaleDateString('tr-TR'),list);
  if(pl) list.filter(x=>x.ref&&x.title==='YouTube videosu').forEach(x=>{ const t=tracks.find(k=>k.ref===x.ref); if(t) fetchMeta({src:'yt',kind:'video',ref:x.ref}).then(mt=>{ if(mt&&mt.title){ Object.assign(t,{title:mt.title,artist:mt.artist||t.artist}); save(); renderMain() } }).catch(()=>{}) });
}
const b64u={ enc:b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''), dec:s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)) };
async function zip(str,mode){ const cs=mode==='c'?new CompressionStream('deflate-raw'):new DecompressionStream('deflate-raw'); const w=new Blob([str]).stream().pipeThrough(cs); return new Uint8Array(await new Response(w).arrayBuffer()) }
async function sharePlaylist(pl){
  const list=pl.ids.map(byId).filter(Boolean).map(t=>[t.ref||'',t.title,t.artist||'']);
  if(!list.length){ toast('Liste boş'); return }
  const raw=JSON.stringify({v:1,n:pl.name,t:list});
  const code='NABIZ-'+b64u.enc(await zip(new TextEncoder().encode(raw),'c'));
  try{ await navigator.clipboard.writeText(code) }catch{}
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box" style="width:min(560px,94vw)"><h3>"${esc(pl.name)}" listesini paylaş</h3><p>Kod panoya kopyalandı. Arkadaşına WhatsApp ya da Discord'dan gönder; o da Nabız'da <b>Çalma listelerin → + → Paylaşım kodundan ekle</b> ya da arama kutusuna yapıştırsın. Liste onun Nabız'ına kopyalanır, ikinizin Nabız'ı ayrı kalır.</p>
    <div class="codebox">${esc(code)}</div><div class="act"><button class="btn ghost" data-x>Kapat</button><button class="btn" data-cp>Tekrar kopyala</button></div></div>`;
  document.body.appendChild(m);
  m.onclick=async e=>{ if(e.target===m||e.target.closest('[data-x]')) m.remove(); if(e.target.closest('[data-cp]')){ try{ await navigator.clipboard.writeText(code); toast('Kopyalandı') }catch{ toast('Kopyalanamadı, kodu seçip Ctrl+C yap') } } };
}
async function importCode(code){
  try{ const body=String(code).trim().replace(/^NABIZ-/i,'').replace(/\s+/g,'');
    const j=JSON.parse(new TextDecoder().decode(await zip(b64u.dec(body),'d')));
    if(!j||!Array.isArray(j.t)) throw 0;
    await createImported(j.n||'Paylaşılan liste',j.t.map(([ref,title,artist])=>({ref:ref||null,title,artist})),{fromCode:true});
  }catch{ toast('Bu paylaşım kodu okunamadı; eksik kopyalanmış olabilir',4500) }
}

async function startRadio(){
  const seed=curVideoId(); if(!seed||!navigator.onLine) return false;
  try{
    const j=await (await fetch('/api/related?id='+encodeURIComponent(seed))).json();
    const inQ=new Set(queue.map(id=>byId(id)&&byId(id).ref));
    const recent=new Set(history.slice(-40).map(h=>h.ref));
    const picks=(Array.isArray(j)?j:[]).filter(v=>{const sec=toSec(v.duration);return sec>60&&sec<600&&!inQ.has(v.id)&&!recent.has(v.id)&&!isBanned(v.id)}).slice(0,15);
    if(!picks.length) return false;
    const ids=picks.map(v=>{const c=cleanYT(v.title,v.channel);const t={id:'r:'+v.id,temp:true,radio:true,src:'yt',kind:'video',ref:v.id,title:c.title,artist:c.artist||'YouTube',thumb:`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`};temp.set(t.id,t);return t.id});
    queue=queue.concat(ids); qi++; load(byId(queue[qi]));
    toast('Radyo: çalan şarkıya benzer şarkılarla devam ediliyor',3000);
    return true;
  }catch{ return false }
}

/* ================= Yumuşak geçiş ================= */
let lastVol=-1;
function applyFade(){
  if(!ytReady||!cur) return;
  const f=+settings.fade||0, base=settings.volume;
  let v=base;
  if(alarmRampUntil){
    const k=Math.min(1,(Date.now()-alarmRampStart)/(alarmRampUntil-alarmRampStart));
    v=Math.round(alarmFrom+(alarmTo-alarmFrom)*k); settings.volume=v; const sl=$('#vol'); if(sl) sl.value=v;
    if(k>=1){ alarmRampUntil=0; settings.volume=alarmTo; save(); pushState() }
  }
  else if(f>0&&dur>f*2&&playing){ const rem=dur-pos; if(rem<f) v=base*Math.max(0,rem)/f; else if(pos<f) v=base*Math.max(0.05,pos/f); }
  v=Math.round(v);
  if(v!==lastVol){ lastVol=v; try{yt.setVolume(v)}catch{} }
}

/* ================= Uyku zamanlayıcısı ================= */
let sleepAt=0, sleepAfterTrack=false;
function sleepNow(){ sleepAt=0; sleepAfterTrack=false; paintSleep(); if(playing) toggle(); toast('Uyku zamanlayıcısı: müzik durduruldu 🌙',3500) }
function paintSleep(){
  const b=$('#sleepBtn'); b.classList.toggle('on',!!(sleepAt||sleepAfterTrack));
  b.title=sleepAt?`Uyku: ${Math.max(1,Math.ceil((sleepAt-Date.now())/60000))} dk sonra duracak`:sleepAfterTrack?'Uyku: bu şarkı bitince duracak':'Uyku zamanlayıcısı';
}
function checkSleep(){
  if(sleepAt){ const rem=(sleepAt-Date.now())/1000;
    if(rem<=0) return sleepNow();
    if(rem<10&&ytReady){ try{yt.setVolume(Math.round(settings.volume*rem/10)); lastVol=-1}catch{} } }
}
$('#sleepBtn').onclick=e=>{
  e.stopPropagation(); const r=e.currentTarget.getBoundingClientRect();
  pop(r.left-120,r.top-250,`<div class="t">Uyku zamanlayıcısı</div>${[15,30,45,60,90].map(m=>`<button data-v="${m}">${m} dakika sonra</button>`).join('')}<button data-v="track">Bu şarkı bitince</button>${sleepAt||sleepAfterTrack?'<button data-v="off">Kapat</button>':''}`,v=>{
    if(v==='off'){ sleepAt=0; sleepAfterTrack=false; toast('Uyku zamanlayıcısı kapatıldı') }
    else if(v==='track'){ sleepAt=0; sleepAfterTrack=true; toast('Bu şarkı bitince müzik duracak') }
    else { sleepAfterTrack=false; sleepAt=Date.now()+(+v)*60000; toast(`${v} dakika sonra müzik duracak`) }
    paintSleep();
  });
};

async function importPlaylist(listId){
  toast('YouTube listesi içe aktarılıyor…',8000);

    const j=await (await fetch('/api/playlist?list='+encodeURIComponent(listId))).json();

function rangeSince(r){ if(r==='all') return 0; if(r==='year') return new Date(new Date().getFullYear(),0,1).getTime(); return Date.now()-(+r)*86400000 }
function computeStats(r){
  const H=history.filter(h=>h.at>=rangeSince(r));
  const bySong=new Map(), byArtist=new Map(), hours=new Array(24).fill(0);
  for(const h of H){
    const k=h.ref||h.title; const e=bySong.get(k)||{h,n:0,secs:0}; e.n++; e.secs+=h.secs||0; e.h=h; bySong.set(k,e);
    const a=(h.artist||'?').trim(); byArtist.set(a,(byArtist.get(a)||0)+(h.secs||0));
    hours[new Date(h.at).getHours()]+=(h.secs||0);
  }
  return { H, mins:Math.round(H.reduce((a,h)=>a+(h.secs||0),0)/60), bySong, byArtist, hours,
    topSongs:[...bySong.values()].sort((x,y)=>y.n-x.n||y.secs-x.secs),
    topArtists:[...byArtist.entries()].sort((x,y)=>y[1]-x[1]),

const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function histStats(sinceMs,filterFn){
  const m=new Map();
  for(const h of history){ if(h.at<sinceMs||!h.ref) continue; if(filterFn&&!filterFn(h)) continue;
    const e=m.get(h.ref)||{h,n:0,last:0,secs:0}; e.n++; e.secs+=h.secs||0; if(h.at>=e.last){e.last=h.at;e.h=h} m.set(h.ref,e) }

async function buildMix(force){
  if(mixLoading||!HTTP) return;
  if(!force&&settings.mix&&settings.mix.day===dayKey()) return;
  const fav=histStats(Date.now()-30*864e5).sort((a,b)=>b.n-a.n).slice(0,12);
  const likedT=tracks.filter(t=>liked.has(t.id)&&t.ref).slice(0,12);
  let seeds=shuf([...fav.map(e=>e.h.ref),...likedT.map(t=>t.ref)]).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
  if(!seeds.length&&(settings.seedArtists||[]).length&&!mixLoading){ mixLoading=true; try{ seeds=await seedArtistRefs(3) }finally{ mixLoading=false } }
  if(!seeds.length) return;
  mixLoading=true;
  try{
    const known=new Set(history.map(h=>h.ref));
    let fresh=[];
    for(const sd of seeds){ try{ const j=await (await fetch('/api/related?id='+encodeURIComponent(sd))).json(); if(Array.isArray(j)) fresh=fresh.concat(j.filter(v=>!known.has(v.id)&&toSec(v.duration)>60&&toSec(v.duration)<600).slice(0,8)) }catch{} }
    const seen=new Set(), items=[];
    for(const v of shuf(fresh)){ if(seen.has(v.id)) continue; seen.add(v.id); const c=cleanYT(v.title,v.channel); items.push({ref:v.id,title:c.title,artist:c.artist||'YouTube',thumb:`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`}); if(items.length>=15) break }
    const favItems=shuf([...fav.map(e=>({ref:e.h.ref,title:e.h.title,artist:e.h.artist,thumb:e.h.thumb})),...likedT.map(t=>({ref:t.ref,title:t.title,artist:t.artist,thumb:t.thumb}))]).filter(x=>!seen.has(x.ref)&&(seen.add(x.ref)||true)).slice(0,10);
    const all=shuf([...favItems,...items]);
    if(all.length){ settings.mix={day:dayKey(),items:all}; save() }
  }finally{ mixLoading=false }
  if(view==='home'||view==='smart:mix') renderMain();
}

/* ================= Müzikli alarm ================= */
let alarmRampUntil=0, alarmRampStart=0, alarmFrom=5, alarmTo=70;
function alarmSources(){
  const o=[['liked','Beğenilenler'],['mix','Günlük Karışık'],['chart','Türkiye listesi'],['library','Tüm şarkıların (karışık)']];
  return o.concat(playlists.map(p=>['pl:'+p.id,p.name]));
}
function alarmIds(src){
  if(src==='liked') return shuf(tracks.filter(t=>liked.has(t.id)).map(t=>t.id));
  if(src==='mix') return mixIds();
  if(src==='chart') return chart.map(t=>t.id);
  if(src&&src.startsWith('pl:')){ const p=playlists.find(x=>'pl:'+x.id===src); return p?p.ids.filter(id=>byId(id)):[] }
  return shuf(tracks.map(t=>t.id));
}
setInterval(()=>checkAlarm(),15000); setTimeout(()=>checkAlarm(),5000);
function nextAlarmText(){
  const a=settings.alarm; if(!a||!a.on) return 'Alarm kapalı';
  if(!a.days.length) return 'Hiçbir gün seçili değil';
  const [h,m]=String(a.time||'08:00').split(':').map(Number); const now=new Date();
  for(let k=0;k<8;k++){ const d=new Date(now); d.setDate(now.getDate()+k); d.setHours(h,m,0,0); if(d>now&&a.days.includes(d.getDay())&&!(k===0&&a.fired===now.toDateString())){
    const mins=Math.round((d-now)/60000), hh=Math.floor(mins/60), mm=mins%60;
    const day=k===0?'bugün':k===1?'yarın':d.toLocaleDateString('tr-TR',{weekday:'long'});
    const dd=Math.floor(hh/24), left=dd?`${dd} gün ${hh%24?hh%24+' sa ':''}`:`${hh?hh+' sa ':''}${mm} dk`;
    return `Bir sonraki alarm: ${day} ${a.time} (${left.trim()} sonra)` } }
  return '';
}
function fireAlarm(test){
  const a=settings.alarm;
  let ids=alarmIds(a.src); if(!ids.length) ids=alarmIds('library'); if(!ids.length) ids=alarmIds('chart');
  if(!ids.length){ toast('Alarm için çalınacak şarkı yok: önce birkaç şarkı beğen ya da bir liste seç',5000); return false }
  // ses, Nabız'ın o anki sesinden bağımsız: çok kısıktan başlayıp alarm sesine kadar yavaşça yükselir
  alarmFrom=5; alarmTo=Math.max(10,Math.min(100,+a.vol||70));
  alarmRampStart=Date.now(); alarmRampUntil=Date.now()+(test?10000:60000);   // gerçek alarmda 1 dakikada açılır
  settings.volume=alarmFrom; $('#vol').value=alarmFrom;
  lastVol=-1; shuffle=false; paintModes(); playTrack(ids[0],ids);
  if(!test) toast('⏰ Günaydın! Alarm çalıyor',6000);
  if(!test&&window.ada&&ada.notify) ada.notify({title:'⏰ Günaydın!',body:'Nabız alarmı çalıyor'}).catch(()=>{});
  return true;
}
function checkAlarm(){
  const a=settings.alarm; if(!a||!a.on) return;
  const now=new Date(), key=now.toDateString();
  if(a.fired===key||!a.days.includes(now.getDay())) return;
  const [h,m]=String(a.time||'08:00').split(':').map(Number);
  const due=new Date(now); due.setHours(h,m,0,0);
  if(now<due||now-due>5*60000) return;           // vaktinde (5 dk tolerans)
  a.fired=key; save();
  fireAlarm(false);
}

async function openRemote(){

      ${r.urls.length>1?`<p style="margin:8px 0 0">Açılmazsa diğer adresleri dene: ${r.urls.slice(1).map(u=>`<code style="display:inline;padding:2px 6px;background:rgba(255,255,255,.06);border-radius:6px">${esc(u)}</code>`).join(' ')}</p>`:''}`}
      <div class="act" style="margin-top:16px;justify-content:space-between"><div style="display:flex;gap:8px"><button class="btn ghost" data-off>Kumandayı kapat</button><button class="btn ghost" data-renew title="Eski QR kodlar artık çalışmaz">Yeni bağlantı</button></div><button class="btn" data-x>Tamam</button></div></div>`;
    if(url){ try{ const QR=await loadQR(); new QR(m.querySelector('#qrc'),{text:url,width:180,height:180,correctLevel:QR.CorrectLevel.M}) }catch{ m.querySelector('#qrc').innerHTML='<span style="color:#000;font-size:12px;text-align:center">QR yüklenemedi —<br>adresi telefona yaz</span>' } }
  };
  document.body.appendChild(m); await draw();
  m.addEventListener('click',async e=>{
    if(e.target===m||e.target.closest('[data-x]')) return m.remove();
    if(e.target.closest('[data-off]')){ await ada.remote(false); m.remove(); toast('Telefondan kumanda kapatıldı'); return }
    const fb=e.target.closest('[data-fwfix]'); if(fb){ fb.disabled=true; fb.textContent='Windows onayı bekleniyor…'; const f=await ada.fwFix().catch(()=>({ok:false})); if(f&&f.ok){ fw={ok:true}; toast('İzin verildi ✓',2500); await draw() } else { fb.disabled=false; fb.textContent='Tekrar dene'; toast('İzin verilmedi',3000) } return }
    if(e.target.closest('[data-renew]')){ r=await ada.remote(true,true); await draw(); toast('Yeni bağlantı oluşturuldu; eski QR kodlar artık çalışmaz',3500) }
  });
}

const vcmp=(a,b)=>{ const x=String(a).split('.').map(Number), y=String(b).split('.').map(Number); for(let i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)-(y[i]||0) } return 0 };
async function loadChangelog(){ try{ const r=await fetch('/changelog.json',{cache:'no-store'}); return r.ok?await r.json():[] }catch{ return [] } }
async function currentVersion(){ try{ if(window.ada&&ada.version) return await ada.version() }catch{} try{ return (await (await fetch('/version.json',{cache:'no-store'})).json()).version }catch{ return '' } }
async function showWhatsNew(entries,ver){
  if(!entries.length) return;
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box wn"><div class="wn-h"><small>Nabız ${esc(ver)}</small><h3>${esc(entries[0].title||'Yenilikler')}</h3><p>Nabız güncellendi. İşte yenilikler:</p></div>
    <div class="wn-b">${entries.map(e=>`<div class="wn-v"><div class="vt"><b>${esc(e.version)}</b><span>${esc(e.date||'')}${e.title&&e!==entries[0]?' · '+esc(e.title):''}</span></div><ul>${(e.changes||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`).join('')}</div>
    <div class="wn-f"><button class="btn" data-x>Harika!</button></div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{ if(e.target===m||e.target.closest('[data-x]')) m.remove() });
}
async function checkWhatsNew(force){
  const ver=await currentVersion(); if(!ver) return;
  const seen=settings.seenVersion;
  const fresh=!tracks.length&&!history.length&&!playlists.length;
  if(!force&&seen===ver) return;
  settings.seenVersion=ver; save();
  if(!force&&fresh&&!seen) return;                       // ilk kurulum: gösterme
  const log=await loadChangelog();
  let entries=force?log.slice(0,3):log.filter(e=>vcmp(e.version,ver)<=0&&(!seen||vcmp(e.version,seen)>0));
  if(!force&&!seen) entries=log.filter(e=>e.version===ver);   // bu özellikten önceki sürümden gelenlere sadece son sürüm
  if(!entries.length) entries=log.filter(e=>e.version===ver);
  showWhatsNew(entries.slice(0,6),ver);
}
