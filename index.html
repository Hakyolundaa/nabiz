<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nabız · Söz kartı</title><meta name="theme-color" content="#0b0a10">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0a10;color:#fff;font-family:Outfit,system-ui,-apple-system,sans-serif;text-align:center;padding:20px 18px 40px}
#pv{max-height:58vh;width:auto;max-width:100%;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.65);display:block;margin:6px auto 0;min-height:200px;background:#16141c}
.b{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;margin:16px auto 0;padding:17px;border-radius:16px;font:700 18px Outfit,system-ui,sans-serif;border:0;color:#fff;text-decoration:none;cursor:pointer;background:linear-gradient(100deg,#ff2e63,#c2189b,#5b2cff);box-shadow:0 10px 30px rgba(194,24,155,.35)}
.s{background:rgba(255,255,255,.1);box-shadow:none;font-size:16px;padding:14px}
h1{font-size:15px;font-weight:500;color:rgba(255,255,255,.6);margin:0 0 12px;letter-spacing:.02em}h1 b{color:#fff}
p{color:rgba(255,255,255,.6);font-size:13.5px;line-height:1.5;max-width:340px;margin:14px auto 0}.err{color:#ffb3c3}
</style></head><body>
<h1><b>Nabız</b> · söz kartı</h1>
<img id="pv" alt="Söz kartı">
<button class="b" id="sh">Paylaş · Instagram, WhatsApp…</button>
<a class="b s" id="dl" download="nabiz-soz-karti.jpg">Telefona kaydet</a>
<p id="tip">“Paylaş”a bas, açılan listeden <b>Instagram</b> (Hikâye) ya da <b>WhatsApp</b>'ı seç.</p>
<script>
const $=s=>document.querySelector(s);
function dec(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))) }
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function rr(x,c,X,Y,W,H,R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); if(c){x.fillStyle=c;x.fill()} }
function fit(x,t,w){ t=String(t||''); if(x.measureText(t).width<=w) return t; while(t.length>1&&x.measureText(t+'…').width>w) t=t.slice(0,-1); return t+'…' }
function cover(x,im,X,Y,S,R){ x.save(); rr(x,null,X,Y,S,S,R); x.clip(); if(im){ const s=Math.min(im.width,im.height*0.75); x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,X,Y,S,S) } else { const g=x.createLinearGradient(X,Y,X+S,Y+S); g.addColorStop(0,'#ff2e63'); g.addColorStop(1,'#5b2cff'); x.fillStyle=g; x.fillRect(X,Y,S,S) } x.restore() }
function wrapLines(x,text,w){ const words=String(text).split(/\s+/); const out=[]; let line=''; for(const wd of words){ const t=line?line+' '+wd:wd; if(x.measureText(t).width>w&&line){ out.push(line); line=wd } else line=t } if(line) out.push(line); return out }
function loadImg(src){ return new Promise(res=>{ if(!src) return res(null); const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; setTimeout(()=>res(null),6000) }) }
async function draw(d){
  const format=d.f==='p'?'post':'story', W=1080, H=format==='story'?1920:1350;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  try{ await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]) }catch{}
  const acc=/^#[0-9a-f]{6}$/i.test(d.k||'')?d.k:'#ff2e63';
  const im=d.v&&/^[\w-]{11}$/.test(d.v)?await loadImg(`https://i.ytimg.com/vi/${d.v}/hqdefault.jpg`):null;
  x.fillStyle='#0b0b10'; x.fillRect(0,0,W,H);
  if(im){ // iPhone Safari canvas filter desteklemiyor: küçültüp büyüterek her tarayıcıda yumuşak bulanık arka plan
    const sm=document.createElement('canvas'); sm.width=18; sm.height=32; const sx=sm.getContext('2d'); sx.imageSmoothingQuality='high';
    const k=Math.min(im.width/18,im.height/32), cw=18*k, ch=32*k; sx.drawImage(im,(im.width-cw)/2,(im.height-ch)/2,cw,ch,0,0,18,32);
    const md=document.createElement('canvas'); md.width=108; md.height=192; const mx=md.getContext('2d'); mx.imageSmoothingQuality='high'; mx.drawImage(sm,0,0,108,192);
    x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; x.drawImage(md,-W*.08,-H*.08,W*1.16,H*1.16);
    x.globalCompositeOperation='saturation'; x.fillStyle='hsl(0,80%,50%)'; x.globalAlpha=.25; x.fillRect(0,0,W,H); x.globalAlpha=1; x.globalCompositeOperation='source-over' }
  else { const g0=x.createLinearGradient(0,0,W,H); g0.addColorStop(0,acc+'88'); g0.addColorStop(1,'#1a0f3a'); x.fillStyle=g0; x.fillRect(0,0,W,H) }
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(0,0,0,.25)'); g.addColorStop(1,'rgba(0,0,0,.7)'); x.fillStyle=g; x.fillRect(0,0,W,H);
  const g2=x.createRadialGradient(W*.2,H*.15,10,W*.2,H*.15,W); g2.addColorStop(0,acc+'55'); g2.addColorStop(1,'transparent'); x.fillStyle=g2; x.fillRect(0,0,W,H);
  const P=90; let y=format==='story'?260:150;
  cover(x,im,P,y,150,22);
  x.fillStyle='#fff'; x.font='700 50px Outfit, sans-serif'; x.fillText(fit(x,d.t,W-P*2-180),P+180,y+70);
  x.fillStyle='rgba(255,255,255,.75)'; x.font='500 38px Outfit, sans-serif'; x.fillText(fit(x,d.a,W-P*2-180),P+180,y+122);
  const lines=(d.l||[]).slice(0,4).map(String);
  let fs=lines.join(' ').length>140?60:lines.join(' ').length>80?70:82; x.font=`800 ${fs}px Outfit, sans-serif`;
  let rows=[]; lines.forEach(l=>rows.push(...wrapLines(x,l,W-P*2)));
  while(rows.length*fs*1.22>H*(format==='story'?.5:.48)&&fs>40){ fs-=6; x.font=`800 ${fs}px Outfit, sans-serif`; rows=[]; lines.forEach(l=>rows.push(...wrapLines(x,l,W-P*2))) }
  const blockH=rows.length*fs*1.22, top=(H-blockH)/2+(format==='story'?40:60);
  x.fillStyle=acc; x.font=`800 ${fs*1.6}px Georgia, serif`; x.fillText('“',P-8,top+fs*0.5);
  x.fillStyle='#fff'; x.font=`800 ${fs}px Outfit, sans-serif`; x.shadowColor='rgba(0,0,0,.35)'; x.shadowBlur=24;
  rows.forEach((r,i)=>x.fillText(r,P,top+fs*1.0+i*fs*1.22)); x.shadowBlur=0;
  if(d.s!=null&&d.s>=0){
    const ty=top+blockH+fs*0.55+40, bw=W-P*2-300, D=+d.d||0, at=+d.s;
    x.fillStyle=acc; x.beginPath(); x.moveTo(P,ty-22); x.lineTo(P+30,ty-4); x.lineTo(P,ty+14); x.closePath(); x.fill();
    x.fillStyle='#fff'; x.font='700 40px Outfit, sans-serif'; const ts=fmt(at); x.fillText(ts,P+50,ty+8);
    if(D){ const bx=P+50+x.measureText(ts).width+30, frac=Math.min(1,at/D);
      rr(x,'rgba(255,255,255,.22)',bx,ty-5,bw,8,4); rr(x,acc,bx,ty-5,Math.max(8,bw*frac),8,4);
      x.fillStyle='#fff'; x.beginPath(); x.arc(bx+bw*frac,ty-1,13,0,7); x.fill();
      x.fillStyle='rgba(255,255,255,.6)'; x.font='500 32px Outfit, sans-serif'; x.fillText(fmt(D),bx+bw+24,ty+8) }
  }
  const by=H-(format==='story'?190:120);
  [0.5,1,0.7,0.9].forEach((h,i)=>{ rr(x,acc,P+i*16,by-30*h,10,30*h,5) });
  x.fillStyle='#fff'; x.font='700 40px Outfit, sans-serif'; x.fillText('Nabız',P+80,by);
  if(d.c){ x.fillStyle='rgba(255,255,255,.6)'; x.font='500 28px Outfit, sans-serif'; const tx=String(d.c).slice(0,40); x.fillText(tx,W-P-x.measureText(tx).width,by) }
  return c;
}
(async()=>{
  let d; try{ d=dec((location.hash.match(/[#&]d=([\w-]+)/)||[])[1]||'') }catch{}
  if(!d||!d.l){ $('#pv').remove(); $('#sh').remove(); $('#dl').remove(); $('#tip').className='err'; $('#tip').textContent='Bu bağlantı eksik ya da bozuk. Nabız\'da söz kartını açıp “Telefona gönder” ile yeni bir QR oluştur.'; return }
  document.title=`${d.t} — Nabız söz kartı`;
  const c=await draw(d);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.95));
  const url=URL.createObjectURL(blob); $('#pv').src=url; $('#dl').href=url;
  const file=new File([blob],'nabiz-soz-karti.jpg',{type:'image/jpeg'});
  const can=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  if(!can){ $('#sh').remove(); $('#tip').innerHTML='“Telefona kaydet”e bas, sonra Instagram\'da hikâye ekle → galeriden seç. Ya da görsele basılı tut → Paylaş.' }
  else $('#sh').onclick=()=>navigator.share({files:[file]}).catch(()=>{});
})();
</script></body></html>
